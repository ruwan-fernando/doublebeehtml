/* ============================================================
   MODULE 5 — TAILOR MANAGEMENT & BAG ASSIGNMENT
   ============================================================ */
function renderTailors(){
  const allDates = [
    ...(state.assignments||[]).map(a => a.date || a.month),
    ...(state.payments||[]).map(p => p.date || p.month),
    ...(state.completions||[]).map(c => c.date || c.month)
  ].filter(Boolean);
  
  const detectedMonths = Array.from(new Set(allDates.map(d => (d||"").slice(0,7)))).filter(Boolean).sort().reverse();
  const currentMo = todayStr().slice(0,7);
  if(!detectedMonths.includes(currentMo)) detectedMonths.unshift(currentMo);
  
  const selectedMonth = tailorFilterState.month || "all";
  const selectedStatus = tailorFilterState.status || "all";
  const searchQuery = (tailorFilterState.search || "").trim().toLowerCase();

  // Filter tailors by status and search
  const filteredTailors = (state.tailors||[]).filter((t, idx) => {
    const code = getTailorCode(t, idx).toLowerCase();
    const name = (t.name||"").toLowerCase();
    const contact = (t.contact||"").toLowerCase();
    const matchesSearch = !searchQuery || name.includes(searchQuery) || code.includes(searchQuery) || contact.includes(searchQuery);
    const matchesStatus = selectedStatus === "all" || (t.status || "Active") === selectedStatus;
    return matchesSearch && matchesStatus;
  });

  // Calculate global summary in selected view
  const activeTailorCount = (state.tailors||[]).filter(t => (t.status||"Active") === "Active").length;
  
  let totalAssignedInView = 0;
  let totalCompletedInView = 0;
  let totalEarnedInView = 0;
  let totalPaidInView = 0;

  (state.tailors||[]).forEach(t => {
    const stats = getTailorStats(t.id, selectedMonth);
    totalAssignedInView += stats.totalAssigned;
    totalCompletedInView += stats.totalCompleted;
    totalEarnedInView += stats.totalEarned;
    totalPaidInView += stats.totalPaid;
  });

  const totalInProgressInView = Math.max(0, totalAssignedInView - totalCompletedInView);
  const netBalanceOwed = (state.tailors||[]).reduce((sum, t) => sum + getTailorStats(t.id, "all").balance, 0);

  // Filter completed deliveries log
  const filteredCompletions = (state.completions||[]).filter(c => {
    const matchesMonth = selectedMonth === "all" || (c.month || (c.date||"").slice(0,7)) === selectedMonth;
    const tailor = (state.tailors||[]).find(t => t.id === c.tailorId);
    const matchesStatus = selectedStatus === "all" || (tailor && (tailor.status||"Active") === selectedStatus);
    const matchesSearch = !searchQuery || (tailor && (tailor.name.toLowerCase().includes(searchQuery) || getTailorCode(tailor).toLowerCase().includes(searchQuery)));
    return matchesMonth && matchesStatus && matchesSearch;
  }).sort((a, b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||"").localeCompare(a.createdAt||""));

  // Filter assignments for the production orders table
  const filteredAssignments = (state.assignments||[]).filter(a => {
    const matchesMonth = selectedMonth === "all" || (a.month || (a.date||"").slice(0,7)) === selectedMonth;
    const tailor = (state.tailors||[]).find(t => t.id === a.tailorId);
    const matchesStatus = selectedStatus === "all" || (tailor && (tailor.status||"Active") === selectedStatus);
    const matchesSearch = !searchQuery || (tailor && (tailor.name.toLowerCase().includes(searchQuery) || getTailorCode(tailor).toLowerCase().includes(searchQuery)));
    return matchesMonth && matchesStatus && matchesSearch;
  }).sort((a, b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||"").localeCompare(a.createdAt||""));

  const monthOptionsHtml = detectedMonths.map(m => `
    <option value="${m}" ${selectedMonth===m?'selected':''}>${monthLabel(m)} (${m})</option>
  `).join("");

  return `
    <div class="card analytics-filter-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
        <div>
          <h3 style="font-size:18px;margin:0;">Tailor Management &amp; Bag Assignment</h3>
          <p style="font-size:12.5px;color:var(--text-faint);margin:3px 0 0;">Assign bags by category &amp; colour, log finished orders to reduce remaining bags, and track payments.</p>
        </div>
        <div class="action-row-btns">
          <button class="btn btn-primary" id="btnOpenAddTailor">${iconPlus()} Add Tailor</button>
          <button class="btn btn-primary" id="btnOpenAssignBags" ${(state.tailors.length && state.categories.length) ? '' : 'disabled style="opacity:0.6;cursor:not-allowed;"'}>${iconNeedle()} Assign Bags</button>
          <button class="btn btn-primary" id="btnOpenLogCompletion" style="background:var(--good);border-color:var(--good);" ${state.tailors.length ? '' : 'disabled style="opacity:0.6;cursor:not-allowed;"'}>${iconCheckCircle()} Log Completed Bags</button>
          <button class="btn btn-ghost" id="btnOpenPayment" ${state.tailors.length ? '' : 'disabled style="opacity:0.6;cursor:not-allowed;"'}>${iconCoin()} Record Payment</button>
          <button class="btn btn-ghost" id="btnOpenColors">${iconPalette()} Colours (${getAllColors().length})</button>
        </div>
      </div>

      <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
        <div class="field">
          <label>Month Filter (Carry-forward &amp; History)</label>
          <select id="tailorMonthFilter">
            <option value="all" ${selectedMonth==="all"?'selected':''}>All Time (Lifetime Cumulative)</option>
            ${monthOptionsHtml}
          </select>
        </div>
        <div class="field">
          <label>Tailor Status</label>
          <select id="tailorStatusFilter">
            <option value="all" ${selectedStatus==="all"?'selected':''}>All Statuses</option>
            <option value="Active" ${selectedStatus==="Active"?'selected':''}>Active Tailors Only</option>
            <option value="Inactive" ${selectedStatus==="Inactive"?'selected':''}>Inactive Tailors Only</option>
          </select>
        </div>
        <div class="field">
          <label>Search Tailor</label>
          <input id="tailorSearchInput" placeholder="Search by name or ID…" value="${esc(tailorFilterState.search||"")}">
        </div>
      </div>
    </div>

    <div class="grid kpi-grid">
      <div class="card kpi-card">
        <div class="kpi-label">Active Tailors</div>
        <div class="kpi-value">${activeTailorCount} <span style="font-size:14px;color:var(--text-faint);font-weight:normal;">/ ${(state.tailors||[]).length} total</span></div>
        <div class="kpi-sub">${(state.assignments||[]).length} assignments · ${(state.completions||[]).length} completed batches</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Total Assigned Bags</div>
        <div class="kpi-value">${totalAssignedInView}</div>
        <div class="kpi-sub">${selectedMonth==="all" ? "All time assignments" : monthLabel(selectedMonth)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Completed vs Remaining In Progress</div>
        <div class="kpi-value good">${totalCompletedInView} <span style="font-size:16px;color:#92400E;font-weight:normal;">(${totalInProgressInView} remaining)</span></div>
        <div class="kpi-sub">Remaining bags reduce as completions are logged (${totalAssignedInView>0 ? Math.round((totalCompletedInView/totalAssignedInView)*100) : 0}% done)</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Total Payment Needed (Earned)</div>
        <div class="kpi-value">${fmt(totalEarnedInView)}</div>
        <div class="kpi-sub" style="color:${netBalanceOwed>0?'var(--bad)':'var(--good)'}">Done Payment: ${fmt(totalPaidInView)} · Balance Owed: ${fmt(netBalanceOwed)}</div>
      </div>
    </div>

    <!-- TAILORS DIRECTORY -->
    <div class="section-title">
      <span>Tailors Summary &amp; Balances (${filteredTailors.length})</span>
    </div>

    <div class="table-wrap" style="margin-bottom:28px;">
      <table>
        <thead>
          <tr>
            <th>Tailor ID &amp; Name</th>
            <th>Contact / Address</th>
            <th>Status</th>
            <th class="num">Assigned</th>
            <th class="num">Completed</th>
            <th class="num">Remaining (In Progress)</th>
            <th class="num">Total Payment to Do</th>
            <th class="num">Done Payment</th>
            <th class="num">Balance Owed</th>
            <th style="text-align:center;">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${filteredTailors.length ? filteredTailors.map((t, idx) => {
            const code = getTailorCode(t, idx);
            const stats = getTailorStats(t.id, selectedMonth);
            const status = t.status || "Active";
            return `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span class="tailor-badge-id">${code}</span>
                    <strong style="color:var(--text);font-size:14px;">${esc(t.name)}</strong>
                  </div>
                  ${t.notes ? `<div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${esc(t.notes)}</div>` : ''}
                </td>
                <td>
                  <div style="font-size:12.5px;color:var(--text);">${esc(t.contact || '—')}</div>
                  ${t.address ? `<div style="font-size:11px;color:var(--text-faint);">${esc(t.address)}</div>` : ''}
                </td>
                <td>
                  <span class="status-pill ${status.toLowerCase()}">${status}</span>
                </td>
                <td class="num strong">${stats.totalAssigned}</td>
                <td class="num" style="color:var(--good);font-weight:600;">${stats.totalCompleted}</td>
                <td class="num">
                  <span class="progress-pill ${stats.inProgress>0 ? 'pending' : 'done'}">${stats.inProgress}</span>
                </td>
                <td class="num strong">${fmt(stats.totalEarned)}</td>
                <td class="num" style="color:var(--good);">${fmt(stats.totalPaid)}</td>
                <td class="num" style="font-weight:600;color:${stats.balance>0 ? 'var(--bad)' : 'var(--good)'}">
                  ${fmt(stats.balance)}
                </td>
                <td>
                  <div class="row-actions" style="justify-content:center;">
                    <button class="btn btn-sm btn-primary" data-quick-complete="${t.id}" title="Log Completed Bags for ${esc(t.name)}" style="background:var(--good);border-color:var(--good);padding:4px 8px;font-size:12px;">
                      ${iconCheckCircle()} Log Done
                    </button>
                    <button class="btn btn-sm btn-ghost" data-quick-assign="${t.id}" title="Assign Bags to ${esc(t.name)}">
                      ${iconNeedle()} Assign
                    </button>
                    <button class="btn btn-sm btn-ghost" data-view-tailor="${t.id}" title="View History &amp; Ledger">
                      ${iconEye()} History
                    </button>
                    <button class="icon-btn" data-edit-tailor="${t.id}" title="Edit Tailor Profile">
                      ${iconEdit()}
                    </button>
                    <button class="icon-btn" data-toggle-tailor-status="${t.id}" title="Toggle Active/Inactive">
                      ${iconPower()}
                    </button>
                    <button class="icon-btn" data-del-tailor="${t.id}" title="Delete Tailor">
                      ${iconTrash()}
                    </button>
                  </div>
                </td>
              </tr>
            `;
          }).join("") : `
            <tr class="empty-row">
              <td colspan="10">
                ${(state.tailors||[]).length ? 'No tailors match your search or filter.' : 'No tailors registered yet. Click "+ Add Tailor" above.'}
              </td>
            </tr>
          `}
        </tbody>
      </table>
    </div>

    <!-- COMPLETED BAGS RECEIVED LOG -->
    <div class="section-title">
      <span>Completed Bags Received Log (${filteredCompletions.length})</span>
    </div>

    <div class="table-wrap" style="margin-bottom:28px;">
      <table>
        <thead>
          <tr>
            <th>Log ID</th>
            <th>Date Received</th>
            <th>Tailor</th>
            <th>Bag Category &amp; Colour</th>
            <th class="num">Completed Qty</th>
            <th class="num">Stitching Rate / Bag</th>
            <th class="num">Wages Earned (Batch)</th>
            <th>Notes / Reference</th>
            <th style="text-align:center;"></th>
          </tr>
        </thead>
        <tbody>
          ${filteredCompletions.length ? filteredCompletions.map(c => {
            const tailor = (state.tailors||[]).find(t => t.id === c.tailorId);
            const cat = (state.categories||[]).find(catItem => catItem.id === c.categoryId);
            return `
              <tr>
                <td><span class="tailor-badge-id">${esc(c.id)}</span></td>
                <td>${esc(c.date || c.createdAt?.slice(0,10) || '—')}</td>
                <td><strong style="color:var(--text);">${tailor ? esc(tailor.name) : '<span style="color:var(--bad)">Deleted tailor</span>'}</strong></td>
                <td>
                  <div style="font-weight:600;color:var(--text);">${cat ? esc(cat.name) : '<span style="color:var(--bad)">Deleted category</span>'}</div>
                  ${c.color ? `<span class="pill" style="font-size:10.5px;padding:1px 7px;margin-top:2px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);display:inline-block;font-weight:500;">${esc(c.color)}</span>` : ''}
                </td>
                <td class="num strong" style="color:var(--good);">${c.qty}</td>
                <td class="num">${fmt(c.rate)}</td>
                <td class="num strong" style="color:var(--good);">${fmt(c.earnedAmount || (c.qty * c.rate))}</td>
                <td>${esc(c.notes || '—')}</td>
                <td style="text-align:center;">
                  <button class="icon-btn" data-del-completion="${c.id}" title="Delete this completion log and restore remaining bags">${iconTrash()}</button>
                </td>
              </tr>
            `;
          }).join("") : `
            <tr class="empty-row">
              <td colspan="9">
                ${(state.completions||[]).length ? 'No completed bags logged for this filter period.' : 'No completed bags logged yet. Click "✅ Log Completed Bags" above when a tailor finishes bags.'}
              </td>
            </tr>
          `}
        </tbody>
      </table>
    </div>

    <!-- ASSIGNMENTS PRODUCTION LOG -->
    <div class="section-title">
      <span>Bag Assignments &amp; Production Orders (${filteredAssignments.length})</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Assignment ID</th>
            <th>Date</th>
            <th>Tailor</th>
            <th>Category &amp; Colour</th>
            <th class="num">Assigned</th>
            <th class="num">Completed</th>
            <th class="num">Remaining (In Progress)</th>
            <th class="num">Rate / Bag</th>
            <th class="num">Earned Amount</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${filteredAssignments.length ? filteredAssignments.map(a => {
            const tailor = (state.tailors||[]).find(t => t.id === a.tailorId);
            const cat = (state.categories||[]).find(c => c.id === a.categoryId);
            const assigned = Number(a.assignedQty)||0;
            const completed = Number(a.completedQty)||0;
            const inProgress = Math.max(0, assigned - completed);
            const rate = Number(a.rate)||0;
            const earned = completed * rate;
            const isDone = completed >= assigned;
            return `
              <tr>
                <td><span class="tailor-badge-id">${esc(a.id || 'ASN')}</span></td>
                <td>${esc(a.date || a.createdAt?.slice(0,10) || '—')}</td>
                <td>
                  <strong style="color:var(--text);">${tailor ? esc(tailor.name) : '<span style="color:var(--bad)">Deleted tailor</span>'}</strong>
                </td>
                <td>
                  <div style="font-weight:600;color:var(--text);">${cat ? esc(cat.name) : '<span style="color:var(--bad)">Deleted category</span>'}</div>
                  ${a.color ? `<span class="pill" style="font-size:10.5px;padding:1px 7px;margin-top:2px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);display:inline-block;font-weight:500;">${esc(a.color)}</span>` : ''}
                </td>
                <td class="num strong">${assigned}</td>
                <td class="num" style="color:var(--good);font-weight:600;">${completed}</td>
                <td class="num">
                  <span class="progress-pill ${inProgress>0 ? 'pending' : 'done'}">${inProgress}</span>
                </td>
                <td class="num">${fmt(rate)}</td>
                <td class="num" style="color:var(--good);font-weight:600;">${fmt(earned)}</td>
                <td>
                  <span class="progress-pill ${isDone ? 'done' : 'pending'}">${isDone ? 'Completed' : 'In Progress'}</span>
                </td>
                <td>
                  <button class="icon-btn" data-del-assign="${a.id}" title="Delete Assignment">${iconTrash()}</button>
                </td>
              </tr>
            `;
          }).join("") : `
            <tr class="empty-row">
              <td colspan="11">
                ${(state.assignments||[]).length ? 'No bag assignments logged for this period.' : 'No bag assignments yet. Click "+ Assign Bags" to create one.'}
              </td>
            </tr>
          `}
        </tbody>
      </table>
    </div>
  `;
}

/* Modals */
function openLogCompletionModal(preselectedTailorId = ""){
  if(!state.tailors.length){ toast("Please add a tailor first."); return; }
  
  const tailorOptions = state.tailors.map((t, idx) => `
    <option value="${t.id}" ${t.id===preselectedTailorId?'selected':''}>${getTailorCode(t, idx)} — ${esc(t.name)} (${t.status||'Active'})</option>
  `).join("");

  showModal(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <span style="color:var(--good);">${iconCheckCircle()}</span>
      <h3 style="margin:0;">Log Completed Bags / Finished Work</h3>
    </div>
    <p style="color:var(--text-dim);font-size:12.5px;margin-bottom:14px;">
      Record finished bags returned by the tailor. This will automatically reduce the tailor's remaining assigned bags, update completion reports, and calculate wages earned.
    </p>

    <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
      <div class="field">
        <label>Tailor *</label>
        <select id="compTailorSelect" required>${tailorOptions}</select>
      </div>
      <div class="field">
        <label>Completion / Receiving Date *</label>
        <input type="date" id="compDate" value="${todayStr()}" required>
      </div>
      <div class="field" style="grid-column:1/-1;">
        <label>Notes / Delivery Reference (Optional)</label>
        <input id="compNotes" placeholder="e.g. Delivered batch #1 to warehouse">
      </div>
    </div>

    <div style="font-size:13px;font-weight:600;margin:12px 0 8px;">Active Assigned Bags for Selected Tailor</div>
    
    <div class="table-wrap" style="max-height:240px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:12px;">
      <table>
        <thead>
          <tr>
            <th>Bag Category &amp; Colour</th>
            <th class="num">Assigned</th>
            <th class="num">Done So Far</th>
            <th class="num">Remaining</th>
            <th class="num" style="min-width:140px;text-align:right;">Completed Now *</th>
            <th class="num">Rate / Bag</th>
            <th class="num">Earned Wages</th>
          </tr>
        </thead>
        <tbody id="compItemsTbody"></tbody>
      </table>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;">
      <div style="font-size:12px;color:var(--text-faint);">
        Tip: Enter the number of finished bags for each category/colour.
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--good);" id="compSummaryReadout">
        Logging 0 Bags · New Payment to Do: ${fmt(0)}
      </div>
    </div>

    <div class="form-actions" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="btnSubmitLogCompletion" style="background:var(--good);border-color:var(--good);">${iconCheckCircle()} Confirm &amp; Log Completed Bags</button>
    </div>
  `, "modal-lg");

  const tailorSel = document.getElementById("compTailorSelect");
  const tbody = document.getElementById("compItemsTbody");
  const readout = document.getElementById("compSummaryReadout");

  const renderActiveItems = ()=>{
    const tId = tailorSel.value;
    const assigns = (state.assignments||[]).filter(a => a.tailorId === tId && (Number(a.assignedQty)||0) > (Number(a.completedQty)||0));
    
    if(!assigns.length){
      tbody.innerHTML = `
        <tr class="empty-row">
          <td colspan="7" style="padding:20px;text-align:center;color:var(--text-faint);">
            This tailor currently has no pending bag assignments in progress.
            <div style="margin-top:8px;">
              <button type="button" class="btn btn-sm btn-ghost" id="btnCompQuickAssign">${iconNeedle()} Assign Bags to this Tailor First</button>
            </div>
          </td>
        </tr>
      `;
      const quickAssignBtn = document.getElementById("btnCompQuickAssign");
      if(quickAssignBtn){
        quickAssignBtn.addEventListener("click", ()=> openAssignModal(tId));
      }
      updateSummary();
      return;
    }

    tbody.innerHTML = assigns.map(a => {
      const cat = (state.categories||[]).find(c => c.id === a.categoryId);
      const assigned = Number(a.assignedQty)||0;
      const completed = Number(a.completedQty)||0;
      const remaining = Math.max(0, assigned - completed);
      const rate = Number(a.rate)||0;

      return `
        <tr class="comp-item-row" data-assign-id="${a.id}" data-rate="${rate}" data-max="${remaining}">
          <td>
            <div style="font-weight:600;color:var(--text);">${cat ? esc(cat.name) : '—'}</div>
            ${a.color ? `<span class="pill" style="font-size:10.5px;padding:1px 7px;margin-top:2px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);display:inline-block;font-weight:500;">${esc(a.color)}</span>` : ''}
          </td>
          <td class="num">${assigned}</td>
          <td class="num" style="color:var(--good);">${completed}</td>
          <td class="num"><span class="progress-pill pending">${remaining}</span></td>
          <td class="num">
            <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;">
              <input type="number" min="0" max="${remaining}" value="0" class="row-comp-now"
                style="width:65px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:3px 6px;font-size:13px;text-align:right;">
              <button type="button" class="btn btn-sm btn-ghost row-btn-all" style="padding:2px 6px;font-size:10px;" title="Fill all remaining">All</button>
            </div>
          </td>
          <td class="num">${fmt(rate)}</td>
          <td class="num row-earned-val" style="font-weight:600;color:var(--good);">${fmt(0)}</td>
        </tr>
      `;
    }).join("");

    tbody.querySelectorAll(".comp-item-row").forEach(tr => {
      const inp = tr.querySelector(".row-comp-now");
      const btnAll = tr.querySelector(".row-btn-all");
      const max = Number(tr.dataset.max)||0;
      const rate = Number(tr.dataset.rate)||0;
      const earnedSpan = tr.querySelector(".row-earned-val");

      const updateRow = ()=>{
        let val = Math.max(0, Math.min(Number(inp.value)||0, max));
        inp.value = val;
        earnedSpan.textContent = fmt(val * rate);
        updateSummary();
      };

      inp.addEventListener("input", updateRow);
      if(btnAll){
        btnAll.addEventListener("click", ()=>{
          inp.value = max;
          updateRow();
        });
      }
    });

    updateSummary();
  };

  const updateSummary = ()=>{
    let totalBags = 0;
    let totalWages = 0;
    tbody.querySelectorAll(".comp-item-row").forEach(tr => {
      const q = Number(tr.querySelector(".row-comp-now")?.value)||0;
      const r = Number(tr.dataset.rate)||0;
      totalBags += q;
      totalWages += q * r;
    });
    readout.textContent = `Logging ${totalBags} Bag${totalBags===1?'':'s'} · New Payment to Do: ${fmt(totalWages)}`;
  };

  tailorSel.addEventListener("change", renderActiveItems);
  renderActiveItems();

  document.getElementById("btnSubmitLogCompletion").addEventListener("click", ()=>{
    const tailorId = tailorSel.value;
    const date = document.getElementById("compDate").value || todayStr();
    const notes = (document.getElementById("compNotes").value||"").trim();
    const rows = Array.from(tbody.querySelectorAll(".comp-item-row"));
    
    let totalLogged = 0;
    const newCompletions = [];

    for(const tr of rows){
      const qty = Number(tr.querySelector(".row-comp-now").value)||0;
      if(qty > 0){
        const assignId = tr.dataset.assignId;
        const rate = Number(tr.dataset.rate)||0;
        const assign = (state.assignments||[]).find(a => a.id === assignId);
        if(assign){
          assign.completedQty = Math.min(Number(assign.assignedQty)||0, (Number(assign.completedQty)||0) + qty);
          assign.updatedAt = new Date().toISOString();
          
          newCompletions.push({
            id: "CMP-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
            assignmentId: assign.id,
            tailorId: assign.tailorId,
            date,
            month: date.slice(0,7),
            categoryId: assign.categoryId,
            color: assign.color,
            qty,
            rate,
            earnedAmount: qty * rate,
            notes,
            createdAt: new Date().toISOString()
          });
          totalLogged += qty;
        }
      }
    }

    if(totalLogged <= 0){
      toast("Please enter at least 1 completed bag to log.");
      return;
    }

    if(!Array.isArray(state.completions)) state.completions = [];
    state.completions.push(...newCompletions);
    saveState();
    closeModal();
    toast(`Successfully logged ${totalLogged} completed bag(s)! Remaining assigned bags updated.`);
    render();
  });
}

function openTailorModal(tailor = null){
  const isEdit = !!tailor;
  showModal(`
    <h3>${isEdit ? 'Edit Tailor Profile' : 'Add New Tailor'}</h3>
    <form id="tailorModalForm" class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
      <div class="field" style="grid-column:1/-1;">
        <label>Tailor Name *</label>
        <input name="name" id="tmName" value="${isEdit?esc(tailor.name):''}" placeholder="e.g. Kamal" required>
      </div>
      <div class="field">
        <label>Contact Number</label>
        <input name="contact" id="tmContact" value="${isEdit?esc(tailor.contact||''):''}" placeholder="e.g. 0771234567">
      </div>
      <div class="field">
        <label>Status</label>
        <select name="status" id="tmStatus">
          <option value="Active" ${(!isEdit || tailor.status==="Active")?'selected':''}>Active</option>
          <option value="Inactive" ${(isEdit && tailor.status==="Inactive")?'selected':''}>Inactive</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1;">
        <label>Address</label>
        <input name="address" id="tmAddress" value="${isEdit?esc(tailor.address||''):''}" placeholder="e.g. Workshop #4, Colombo">
      </div>
      <div class="field" style="grid-column:1/-1;">
        <label>Notes</label>
        <input name="notes" id="tmNotes" value="${isEdit?esc(tailor.notes||''):''}" placeholder="e.g. Specializes in Crocodile and PU bags">
      </div>
    </form>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveTailorModalBtn">${isEdit ? 'Save Changes' : 'Add Tailor'}</button>
    </div>
  `, "modal-md");

  document.getElementById("saveTailorModalBtn").addEventListener("click", (e)=>{
    e.preventDefault();
    const form = document.getElementById("tailorModalForm");
    if(!form.reportValidity()) return;
    const name = document.getElementById("tmName").value.trim();
    if(!name) return;
    const contact = document.getElementById("tmContact").value.trim();
    const status = document.getElementById("tmStatus").value || "Active";
    const address = document.getElementById("tmAddress").value.trim();
    const notes = document.getElementById("tmNotes").value.trim();

    if(isEdit){
      tailor.name = name;
      tailor.contact = contact;
      tailor.status = status;
      tailor.address = address;
      tailor.notes = notes;
      tailor.updatedAt = new Date().toISOString();
      saveState(); closeModal(); toast("Tailor updated"); render();
    } else {
      const newTailor = {
        id: "t_" + uid(),
        code: "T-" + String((state.tailors||[]).length + 1).padStart(3, "0"),
        name,
        contact,
        status,
        address,
        notes,
        createdAt: new Date().toISOString()
      };
      state.tailors.push(newTailor);
      saveState(); closeModal(); toast("Tailor added"); render();
    }
  });
}

function openColorsModal(){
  const colors = getAllColors();
  showModal(`
    <h3>Colours Library</h3>
    <p style="color:var(--text-dim);font-size:12.5px;margin-bottom:14px;">Manage global colours available for bag categories and tailor work assignments.</p>
    
    <div class="field" style="margin-bottom:14px;">
      <label>Add New Colour</label>
      <div style="display:flex;gap:8px;">
        <input id="newGlobalColorInput" placeholder="e.g. Olive Green, Rose Gold" style="flex:1;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13.5px;">
        <button class="btn btn-primary btn-sm" id="btnAddGlobalColor">${iconPlus()} Add Colour</button>
      </div>
    </div>

    <div style="font-size:12px;color:var(--text-faint);margin-bottom:6px;">Current Colours (${colors.length})</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow-y:auto;padding:10px;background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:var(--radius-sm);">
      ${colors.map(col => `
        <span class="chip" style="font-size:12px;padding:4px 9px;">
          ${esc(col)}
          <button type="button" data-del-global-color="${esc(col)}" title="Remove colour">&times;</button>
        </span>
      `).join("")}
    </div>

    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="closeModal()">Done</button>
    </div>
  `, "modal-md");

  document.getElementById("btnAddGlobalColor").addEventListener("click", ()=>{
    const input = document.getElementById("newGlobalColorInput");
    const val = (input.value||"").trim();
    if(val){
      addGlobalColor(val);
      toast(`Colour "${val}" added`);
      openColorsModal();
    }
  });

  document.querySelectorAll("[data-del-global-color]").forEach(b => {
    b.addEventListener("click", ()=>{
      const col = b.dataset.delGlobalColor;
      if(Array.isArray(state.colors)){
        state.colors = state.colors.filter(c => c.toLowerCase() !== col.toLowerCase());
        saveState();
        openColorsModal();
      }
    });
  });
}

function openPaymentModal(preselectedTailorId = ""){
  if(!state.tailors.length){ toast("Please add a tailor first."); return; }
  const tailorOptions = state.tailors.map((t, idx) => `
    <option value="${t.id}" ${t.id===preselectedTailorId?'selected':''}>${getTailorCode(t, idx)} — ${esc(t.name)} (${t.status||'Active'})</option>
  `).join("");

  showModal(`
    <h3>Record Tailor Payment</h3>
    <form id="recordPaymentForm" class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
      <div class="field"><label>Payment Date *</label><input type="date" id="payDate" value="${todayStr()}" required></div>
      <div class="field"><label>Tailor *</label><select id="payTailorId" required>${tailorOptions}</select></div>
      <div class="field" style="grid-column:1/-1;"><label>Amount Paid (${CURRENCY}) *</label><input type="number" step="0.01" min="0.01" id="payAmount" placeholder="0.00" required></div>
      <div class="field" style="grid-column:1/-1;"><label>Notes / Voucher / Reference</label><input id="payNotes" placeholder="Optional notes…"></div>
    </form>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="btnSubmitPayment">${iconCoin()} Save Payment</button>
    </div>
  `, "modal-md");

  document.getElementById("btnSubmitPayment").addEventListener("click", (e)=>{
    e.preventDefault();
    const date = document.getElementById("payDate").value || todayStr();
    const tailorId = document.getElementById("payTailorId").value;
    const amount = Number(document.getElementById("payAmount").value)||0;
    const notes = (document.getElementById("payNotes").value||"").trim();
    if(!tailorId || amount <= 0){
      toast("Please provide tailor and a valid payment amount.");
      return;
    }
    state.payments.push({
      id: "PAY-" + uid(),
      date,
      month: date.slice(0,7),
      tailorId,
      amount,
      notes,
      createdAt: new Date().toISOString()
    });
    saveState(); closeModal(); toast("Payment recorded"); render();
  });
}

function openAssignModal(preselectedTailorId = ""){
  if(!state.tailors.length){ toast("Please add a tailor first."); return; }
  if(!state.categories.length){ toast("Please add at least one bag category first."); return; }

  const tailorOptions = state.tailors.map((t, idx) => `
    <option value="${t.id}" ${t.id===preselectedTailorId?'selected':''}>${getTailorCode(t, idx)} — ${esc(t.name)} ${t.status==='Inactive'?'(Inactive)':''}</option>
  `).join("");

  showModal(`
    <h3>Assign Bags to Tailor</h3>
    <p style="color:var(--text-dim);font-size:12.5px;margin-bottom:12px;">Assign multiple bag categories, colours, and quantities in one batch.</p>
    
    <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
      <div class="field"><label>Tailor *</label><select id="batchTailorId" required>${tailorOptions}</select></div>
      <div class="field"><label>Assignment Date *</label><input type="date" id="batchDate" value="${todayStr()}" required></div>
    </div>

    <div style="font-size:13px;font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center;">
      <span>Bag Assignment Details</span>
      <button type="button" class="btn btn-sm btn-ghost" id="btnInlineAddColor">${iconPalette()} + New Colour</button>
    </div>

    <div class="table-wrap" style="max-height:260px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);">
      <table class="batch-assign-table">
        <thead>
          <tr>
            <th style="width:28%;">Bag Category *</th>
            <th style="width:26%;">Colour *</th>
            <th style="width:18%;text-align:right;">Assigned Qty *</th>
            <th style="width:20%;text-align:right;">Rate / Bag (${CURRENCY}) *</th>
            <th style="width:8%;"></th>
          </tr>
        </thead>
        <tbody id="batchRowsBody"></tbody>
      </table>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;">
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddAssignRow">${iconPlus()} Add Bag Assignment</button>
      <div style="font-size:13px;font-weight:600;color:var(--accent);" id="batchSummaryReadout">Total Assigned: 0 Bags · Est. Value: ${fmt(0)}</div>
    </div>

    <div class="form-actions" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="btnSubmitBatchAssign">${iconNeedle()} Confirm &amp; Assign</button>
    </div>
  `, "modal-lg");

  const tbody = document.getElementById("batchRowsBody");

  const createRow = (catId = "", color = "", qty = 10, rate = 350)=>{
    const tr = document.createElement("tr");
    tr.className = "assign-batch-row";

    const allColors = getAllColors();
    const catOpts = state.categories.map(c => `<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.name)}</option>`).join("");
    const colorOpts = allColors.map(col => `<option value="${esc(col)}" ${col===color?'selected':''}>${esc(col)}</option>`).join("");

    tr.innerHTML = `
      <td>
        <select class="row-cat" required>${catOpts}</select>
      </td>
      <td>
        <select class="row-color" required>${colorOpts}</select>
      </td>
      <td>
        <input type="number" class="row-qty" min="1" value="${qty}" required style="text-align:right;">
      </td>
      <td>
        <input type="number" step="0.01" min="0" class="row-rate" value="${rate}" required style="text-align:right;">
      </td>
      <td style="text-align:center;">
        <button type="button" class="icon-btn row-del-btn" title="Remove row">${iconTrash()}</button>
      </td>
    `;

    tr.querySelector(".row-del-btn").addEventListener("click", ()=>{
      if(tbody.querySelectorAll("tr").length > 1){
        tr.remove();
        updateBatchSummary();
      } else {
        toast("Must have at least one bag assignment.");
      }
    });

    tr.querySelectorAll("input, select").forEach(inp => {
      inp.addEventListener("input", updateBatchSummary);
    });

    tbody.appendChild(tr);
    updateBatchSummary();
  };

  const updateBatchSummary = ()=>{
    let totalBags = 0;
    let totalVal = 0;
    tbody.querySelectorAll("tr").forEach(tr => {
      const q = Number(tr.querySelector(".row-qty")?.value)||0;
      const r = Number(tr.querySelector(".row-rate")?.value)||0;
      totalBags += q;
      totalVal += q * r;
    });
    const readout = document.getElementById("batchSummaryReadout");
    if(readout){
      readout.textContent = `Total Assigned: ${totalBags} Bags · Est. Value: ${fmt(totalVal)}`;
    }
  };

  // Add initial row
  const firstCat = state.categories[0]?.id || "";
  const firstColors = getCategoryColors(state.categories[0]);
  const defaultCol = firstColors[0] || getAllColors()[0] || "Black";
  createRow(firstCat, defaultCol, 10, 350);

  document.getElementById("btnAddAssignRow").addEventListener("click", ()=>{
    createRow(firstCat, defaultCol, 10, 350);
  });

  document.getElementById("btnInlineAddColor").addEventListener("click", ()=>{
    const name = prompt("Enter new colour name:");
    if(name && name.trim()){
      addGlobalColor(name.trim());
      toast(`Colour "${name.trim()}" added`);
      const allColors = getAllColors();
      tbody.querySelectorAll(".row-color").forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = allColors.map(col => `<option value="${esc(col)}" ${col===cur?'selected':''}>${esc(col)}</option>`).join("");
      });
    }
  });

  document.getElementById("btnSubmitBatchAssign").addEventListener("click", ()=>{
    const tailorId = document.getElementById("batchTailorId").value;
    const date = document.getElementById("batchDate").value || todayStr();
    const rows = tbody.querySelectorAll("tr");
    if(!tailorId){ toast("Please select a tailor."); return; }
    if(!rows.length){ toast("Please add at least one bag assignment row."); return; }

    const newAssignments = [];
    for(const tr of rows){
      const catId = tr.querySelector(".row-cat").value;
      const color = tr.querySelector(".row-color").value;
      const qty = Number(tr.querySelector(".row-qty").value)||0;
      const rate = Number(tr.querySelector(".row-rate").value)||0;
      if(qty <= 0){ toast("Quantity must be greater than zero."); return; }

      newAssignments.push({
        id: "ASN-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
        tailorId,
        date,
        month: date.slice(0,7),
        year: date.slice(0,4),
        categoryId: catId,
        color,
        assignedQty: qty,
        completedQty: 0,
        rate,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
    }

    state.assignments.push(...newAssignments);
    saveState();
    closeModal();
    toast(`${newAssignments.length} bag assignment${newAssignments.length===1?'':'s'} saved!`);
    render();
  });
}

function openTailorHistoryModal(tailorId){
  const tailor = state.tailors.find(t => t.id === tailorId);
  if(!tailor) return;
  const idx = state.tailors.findIndex(t => t.id === tailorId);
  const code = getTailorCode(tailor, idx);
  const stats = getTailorStats(tailorId, tailorFilterState.month);
  const allTimeStats = getTailorStats(tailorId, "all");

  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="tailor-badge-id">${code}</span>
          <h3 style="margin:0;font-size:18px;">${esc(tailor.name)}</h3>
          <span class="status-pill ${(tailor.status||'Active').toLowerCase()}">${tailor.status||'Active'}</span>
        </div>

    <div style="font-size:13px;font-weight:600;margin:14px 0 6px;">Completed Bags Received Log (${stats.allCompletions?.length || 0})</div>
    <div class="table-wrap" style="max-height:180px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:16px;">
      <table>
        <thead>
          <tr>
            <th>Log ID</th>
            <th>Date Received</th>
            <th>Category &amp; Colour</th>
            <th class="num">Completed Qty</th>
            <th class="num">Rate / Bag</th>
            <th class="num">Wages Earned</th>
            <th>Notes</th>
            <th></th>

              <tr>
                <td><span class="tailor-badge-id">${esc(c.id)}</span></td>
                <td>${esc(c.date || '—')}</td>
                <td>
                  <strong>${cat?esc(cat.name):'—'}</strong>
                  ${c.color ? `<span class="pill" style="font-size:10px;padding:1px 6px;margin-left:4px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);">${esc(c.color)}</span>` : ''}
                </td>
                <td class="num strong" style="color:var(--good);">${c.qty}</td>
                <td class="num">${fmt(c.rate)}</td>
                <td class="num strong" style="color:var(--good);">${fmt(c.earnedAmount || (c.qty * c.rate))}</td>
                <td>${esc(c.notes||'—')}</td>
                <td>
                  <button class="icon-btn" data-del-completion="${c.id}" title="Delete completion log">${iconTrash()}</button>
                </td>
              </tr>
            `;
          }).join("") : `<tr class="empty-row"><td colspan="8">No completed bag deliveries logged for this tailor yet.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div style="font-size:13px;font-weight:600;margin:14px 0 6px;">Bag Assignments &amp; Production Status (${stats.allAssigns.length})</div>
    <div class="table-wrap" style="max-height:200px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:16px;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Category &amp; Colour</th>
            <th class="num">Assigned</th>
            <th class="num">Completed</th>
            <th class="num">Remaining</th>
            <th class="num">Rate</th>
            <th class="num">Earned</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${stats.allAssigns.length ? stats.allAssigns.map(a => {
            const cat = state.categories.find(c => c.id === a.categoryId);
            const assigned = Number(a.assignedQty)||0;
            const done = Number(a.completedQty)||0;
            const inProg = Math.max(0, assigned - done);
            const earned = done * (Number(a.rate)||0);
            return `
              <tr>
                <td><span class="tailor-badge-id">${esc(a.id||'ASN')}</span></td>
                <td>${esc(a.date || '—')}</td>
                <td>
                  <strong>${cat?esc(cat.name):'—'}</strong>
                  ${a.color ? `<span class="pill" style="font-size:10px;padding:1px 6px;margin-left:4px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-soft);">${esc(a.color)}</span>` : ''}

                <td class="num strong">${assigned}</td>
                <td class="num" style="color:var(--good);font-weight:600;">${done}</td>
                <td class="num"><span class="progress-pill ${inProg>0?'pending':'done'}">${inProg}</span></td>
                <td class="num">${fmt(a.rate)}</td>
                <td class="num" style="color:var(--good);font-weight:600;">${fmt(earned)}</td>

              </tr>

      </table>

    <div style="font-size:13px;font-weight:600;margin:14px 0 6px;">Payment Ledger (${stats.allPayments.length})</div>
    <div class="table-wrap" style="max-height:160px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th class="num">Amount Paid</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${stats.allPayments.length ? stats.allPayments.map(p => `
            <tr>
              <td>${esc(p.date)}</td>
              <td class="num strong" style="color:var(--good);">${fmt(p.amount)}</td>
              <td>${esc(p.notes||'—')}</td>
              <td>
                <button class="icon-btn" data-del-payment="${p.id}" title="Delete payment">${iconTrash()}</button>
              </td>
            </tr>
          `).join("") : `<tr class="empty-row"><td colspan="4">No payments recorded yet.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `, "modal-lg");

  document.getElementById("btnHistLogComp").addEventListener("click", ()=>{
    openLogCompletionModal(tailorId);
  });
  document.getElementById("btnHistAssignMore").addEventListener("click", ()=>{
    openAssignModal(tailorId);
  });
  document.getElementById("btnHistPay").addEventListener("click", ()=>{
    openPaymentModal(tailorId);
  });

  document.querySelectorAll("[data-del-completion]").forEach(b => {
    b.addEventListener("click", ()=>{
      deleteCompletion(b.dataset.delCompletion, tailorId);
    });
  });

  document.querySelectorAll("[data-del-payment]").forEach(b => {
    b.addEventListener("click", ()=>{
      const pid = b.dataset.delPayment;
      confirmDelete("This payment record will be removed.", ()=>{
        state.payments = state.payments.filter(p => p.id !== pid);
        saveState();
        openTailorHistoryModal(tailorId);
      });
    });
  });
}

function deleteCompletion(compId, refreshTailorId = null){
  const comp = (state.completions||[]).find(c => c.id === compId);
  if(!comp) return;
  confirmDelete(`This completed delivery of ${comp.qty} bag(s) will be deleted and restored back to remaining in-progress bags.`, ()=>{
    if(comp.assignmentId){
      const a = (state.assignments||[]).find(x => x.id === comp.assignmentId);
      if(a){
        a.completedQty = Math.max(0, (Number(a.completedQty)||0) - Number(comp.qty));
        a.updatedAt = new Date().toISOString();
      }
    }
    state.completions = (state.completions||[]).filter(c => c.id !== compId);
    saveState();
    toast("Completion record deleted. Remaining bags restored.");
    if(refreshTailorId){
      openTailorHistoryModal(refreshTailorId);
    } else {
      render();
    }
  });
}

/* ============================================================
   MODULE — BACKUP / RESTORE
   ============================================================ */
function renderData(){
  const counts = {
    Categories: state.categories.length, Orders: state.orders.length, Returns: state.returns.length,
    Income: state.income.length, Expenses: state.expenses.length, Tailors: state.tailors.length,
  };
  return `
    <div class="two-col">
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:10px;">Export your data</h3>
        <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0 0 14px;">
          Download everything as a JSON file. Keep it somewhere safe — Google Drive, Dropbox, email to yourself — since data only lives in this browser otherwise.
        </p>
        <button class="btn btn-primary" id="exportBtn">Download backup (.json)</button>
      </div>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:10px;">Restore from a file</h3>
        <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0 0 14px;">
          Restoring replaces all current data in this browser with the contents of the file. Export a backup first if you're not sure.
        </p>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
        <button class="btn btn-ghost" id="importBtn">Choose backup file…</button>
      </div>
    </div>
    <div class="section-title">What's stored right now</div>
    <div class="grid" style="grid-template-columns: repeat(auto-fit,minmax(140px,1fr));">
      ${Object.entries(counts).map(([k,v])=>`<div class="card"><div class="kpi-label">${k}</div><div class="kpi-value">${v}</div></div>`).join("")}
    </div>
    <div class="section-title">Danger zone</div>
    <div class="card">
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 14px;">Erase all data stored in this browser. This cannot be undone — export a backup first.</p>
      <button class="btn btn-danger" id="wipeBtn">Erase all data</button>
    </div>
  `;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindTabEvents(){
  if(currentTab === "dashboard"){
    const month = document.getElementById("dashMonth");
    const year = document.getElementById("dashYear");
    const category = document.getElementById("dashCategory");
    const status = document.getElementById("dashStatus");
    if(month) month.addEventListener("change", ()=>{ dashboardState.month = month.value; render(); });
    if(year) year.addEventListener("change", ()=>{ dashboardState.year = year.value; render(); });
    if(category) category.addEventListener("change", ()=>{ dashboardState.categoryId = category.value; render(); });
    if(status) status.addEventListener("change", ()=>{ dashboardState.status = status.value; render(); });
  }

  if(currentTab === "categories"){
    const form = document.getElementById("catForm");
    const updateReadout = ()=>{
      const fd = new FormData(form);
      const profit = (Number(fd.get("price"))||0) - (Number(fd.get("cost"))||0);
      document.getElementById("catProfitReadout").textContent = fmt(profit);
    };
    form.addEventListener("input", updateReadout);
    document.getElementById("catSubmit").addEventListener("click", (e)=>{
      e.preventDefault();
      if(!form.reportValidity()) return;
      const fd = new FormData(form);
      const name = fd.get("name").trim();
      if(!name) return;
      const rawColors = (fd.get("colors")||"").trim();
      const colors = rawColors ? rawColors.split(",").map(s=>s.trim()).filter(Boolean) : [];
      state.categories.push({ id: uid(), name, colors, cost: Number(fd.get("cost")), price: Number(fd.get("price")) });
      saveState(); toast("Category added"); render();
    });
    document.querySelectorAll("[data-del-cat]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.dataset.delCat;
      confirmDelete("This bag category will be removed from the catalog.", ()=>{
        state.categories = state.categories.filter(c=>c.id!==id);
        saveState(); toast("Category deleted"); render();
      });
    }));
    document.querySelectorAll("[data-edit-cat]").forEach(b=> b.addEventListener("click", ()=>{
      const cat = state.categories.find(c=>c.id===b.dataset.editCat);
      const currentColorsStr = getCategoryColors(cat).join(", ");
      showModal(`
        <h3>Edit category</h3>
        <div class="field" style="margin-bottom:10px;"><label>Bag category name</label><input id="editName" value="${esc(cat.name)}"></div>
        <div class="field" style="margin-bottom:10px;"><label>Available colours (comma-separated)</label><input id="editColors" value="${esc(currentColorsStr)}" placeholder="e.g. Black, Red, Brown"></div>
        <div class="field" style="margin-bottom:10px;"><label>Production cost</label><input id="editCost" type="number" step="0.01" value="${cat.cost}"></div>
        <div class="field" style="margin-bottom:16px;"><label>Selling price</label><input id="editPrice" type="number" step="0.01" value="${cat.price}"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="saveEditCat">Save</button>
        </div>
      `);
      document.getElementById("saveEditCat").addEventListener("click", ()=>{
        cat.name = document.getElementById("editName").value.trim() || cat.name;
        const rawCol = document.getElementById("editColors").value.trim();
        cat.colors = rawCol ? rawCol.split(",").map(s=>s.trim()).filter(Boolean) : [];
        cat.cost = Number(document.getElementById("editCost").value)||0;
        cat.price = Number(document.getElementById("editPrice").value)||0;
        saveState(); closeModal(); toast("Category updated"); render();
      });
    }));
  }

  if(currentTab === "orders"){
    const form = document.getElementById("orderForm");
    if(form){
      const updateReadout = ()=>{
        const fd = new FormData(form);
        const cat = state.categories.find(c=>c.id===fd.get("categoryId"));
        const qty = Number(fd.get("qty"))||0;
        const delivery = Number(fd.get("deliveryCharge"))||0;
        const discount = Math.max(0, Number(fd.get("discount"))||0);
        const totalDelivery = qty*delivery;
        const grossSelling = qty*(cat?Number(cat.price):0);
        const totalSelling = grossSelling - discount;
        const totalCost = qty*(cat?Number(cat.cost):0);
        const totalProfit = totalSelling - totalCost - totalDelivery;
        document.getElementById("ordDelivery").textContent = fmt(totalDelivery);
        document.getElementById("ordSelling").textContent = fmt(totalSelling);
        const profitEl = document.getElementById("ordProfit");
        profitEl.textContent = fmt(totalProfit);
        profitEl.style.color = totalProfit>=0 ? "var(--good)" : "var(--bad)";
      };
      form.addEventListener("input", updateReadout);
      updateReadout();
      document.getElementById("orderSubmit").addEventListener("click", (e)=>{
        e.preventDefault();
        if(!form.reportValidity()) return;
        const fd = new FormData(form);
        state.orders.push({
          id: uid(), date: fd.get("date"),
          categoryId: fd.get("categoryId"), qty: Number(fd.get("qty")),
          status: fd.get("status") || "Completed",
          deliveryCharge: Number(fd.get("deliveryCharge")),
          discount: Math.max(0, Number(fd.get("discount"))||0),
        });
        saveState(); toast("Order logged"); render();
      });
    }
    document.querySelectorAll("[data-del-order]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.dataset.delOrder;
      confirmDelete("This order will be removed.", ()=>{
        state.orders = state.orders.filter(o=>o.id!==id);
        saveState(); toast("Order deleted"); render();
      });
    }));
    document.querySelectorAll("[data-edit-order]").forEach(b=> b.addEventListener("click", ()=>{
      const o = state.orders.find(ord=>ord.id===b.dataset.editOrder);
      if(!o) return;
      const catOptions = state.categories.map(c=>`<option value="${c.id}" ${o.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join("");
      showModal(`
        <h3>Edit order</h3>
        <div class="field" style="margin-bottom:10px;"><label>Date</label><input id="editOrdDate" type="date" value="${o.date||todayStr()}"></div>
        <div class="field" style="margin-bottom:10px;"><label>Bag category</label>
          <select id="editOrdCat">${catOptions}</select>
        </div>
        <div class="field" style="margin-bottom:10px;"><label>Quantity</label><input id="editOrdQty" type="number" min="1" value="${o.qty||1}"></div>
        <div class="field" style="margin-bottom:10px;"><label>Order status</label>
          <select id="editOrdStatus">
            <option value="Completed" ${(o.status||"Completed")==="Completed"?'selected':''}>Completed</option>
            <option value="Pending" ${(o.status||"")==="Pending"?'selected':''}>Pending</option>
            <option value="Cancelled" ${(o.status||"")==="Cancelled"?'selected':''}>Cancelled</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:10px;"><label>Delivery charge / unit (${CURRENCY})</label><input id="editOrdDelivery" type="number" step="0.01" min="0" value="${o.deliveryCharge!=null?o.deliveryCharge:state.settings.defaultDelivery}"></div>
        <div class="field" style="margin-bottom:16px;"><label>Discount amount (${CURRENCY})</label><input id="editOrdDiscount" type="number" step="0.01" min="0" value="${o.discount||0}"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="saveEditOrd">Save</button>
        </div>
      `);
      document.getElementById("saveEditOrd").addEventListener("click", ()=>{
        o.date = document.getElementById("editOrdDate").value || o.date;
        o.categoryId = document.getElementById("editOrdCat").value || o.categoryId;
        o.qty = Number(document.getElementById("editOrdQty").value) || 1;
        o.status = document.getElementById("editOrdStatus").value || "Completed";
        o.deliveryCharge = Number(document.getElementById("editOrdDelivery").value) || 0;
        o.discount = Math.max(0, Number(document.getElementById("editOrdDiscount").value) || 0);
        saveState(); closeModal(); toast("Order updated"); render();
      });
    }));
  }

  if(currentTab === "returns"){
    const form = document.getElementById("returnForm");
    if(form){
      const updateReadout = ()=>{
        const fd = new FormData(form);
        const cat = state.categories.find(c=>c.id===fd.get("categoryId"));
        const qty = Number(fd.get("qty"))||0;
        const rate = Number(fd.get("deliveryRate"))||0;
        const deliveryAmt = qty*rate;
        const profitImpact = cat ? qty*(Number(cat.price)-Number(cat.cost)-rate) : 0;
        document.getElementById("retDelivery").textContent = fmt(deliveryAmt);
        document.getElementById("retLoss").textContent = fmt(deliveryAmt+profitImpact);
      };
      form.addEventListener("input", updateReadout);
      updateReadout();
      document.getElementById("returnSubmit").addEventListener("click", (e)=>{
        e.preventDefault();
        if(!form.reportValidity()) return;
        const fd = new FormData(form);
        state.returns.push({
          id: uid(), date: fd.get("date"),
          categoryId: fd.get("categoryId"), qty: Number(fd.get("qty")), deliveryRate: Number(fd.get("deliveryRate")),
        });
        saveState(); toast("Return logged"); render();
      });
    }
    document.querySelectorAll("[data-del-return]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.dataset.delReturn;
      confirmDelete("This return record will be removed.", ()=>{
        state.returns = state.returns.filter(r=>r.id!==id);
        saveState(); toast("Return deleted"); render();
      });
    }));
  }

  if(currentTab === "reports"){
    document.querySelectorAll("[data-preset]").forEach(b=> b.addEventListener("click", ()=>{
      const r = reportRange(b.dataset.preset);
      if(r){
        reportState.start = r.start;
        reportState.end = r.end;
        if(r.start) reportState.year = r.start.slice(0,4);
        render();
      }
    }));
    const rpStart = document.getElementById("rpStart");
    const rpEnd = document.getElementById("rpEnd");
    const rpCategory = document.getElementById("rpCategory");
    const rpYear = document.getElementById("rpYear");
    if(rpStart) rpStart.addEventListener("change", ()=>{
      reportState.start = rpStart.value;
      if(rpStart.value) reportState.year = rpStart.value.slice(0,4);
      render();
    });
    if(rpEnd) rpEnd.addEventListener("change", ()=>{ reportState.end = rpEnd.value; render(); });
    if(rpCategory) rpCategory.addEventListener("change", ()=>{ reportState.categoryId = rpCategory.value; render(); });
    if(rpYear) rpYear.addEventListener("change", ()=>{ reportState.year = rpYear.value; render(); });
  }

  if(currentTab === "finance"){
    const incomeForm = document.getElementById("incomeForm");
    document.getElementById("incomeSubmit").addEventListener("click", (e)=>{
      e.preventDefault();
      if(!incomeForm.reportValidity()) return;
      const fd = new FormData(incomeForm);
      state.income.push({ id: uid(), date: fd.get("date"), type: fd.get("type"), desc: fd.get("desc").trim(), amount: Number(fd.get("amount")) });
      saveState(); toast("Income added"); render();
    });
    document.getElementById("addIncomeType").addEventListener("click", ()=>{
      const val = document.getElementById("newIncomeType").value.trim();
      if(val && !state.incomeTypes.includes(val)){ state.incomeTypes.push(val); saveState(); toast("Income type added"); render(); }
    });
    document.querySelectorAll("[data-del-income]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.dataset.delIncome;
      confirmDelete("This income entry will be removed.", ()=>{
        state.income = state.income.filter(i=>i.id!==id); saveState(); toast("Income deleted"); render();
      });
    }));

    const expenseForm = document.getElementById("expenseForm");
    document.getElementById("expenseSubmit").addEventListener("click", (e)=>{
      e.preventDefault();
      if(!expenseForm.reportValidity()) return;
      const fd = new FormData(expenseForm);
      state.expenses.push({ id: uid(), date: fd.get("date"), type: fd.get("type"), desc: fd.get("desc").trim(), amount: Number(fd.get("amount")) });
      saveState(); toast("Expense added"); render();
    });
    document.getElementById("addExpenseType").addEventListener("click", ()=>{
      const val = document.getElementById("newExpenseType").value.trim();
      if(val && !state.expenseTypes.includes(val)){ state.expenseTypes.push(val); saveState(); toast("Expense type added"); render(); }
    });
    document.querySelectorAll("[data-del-expense]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.dataset.delExpense;
      confirmDelete("This expense entry will be removed.", ()=>{
        state.expenses = state.expenses.filter(x=>x.id!==id); saveState(); toast("Expense deleted"); render();
      });
    }));
  }

  if(currentTab === "tailors"){
    // Month filter
    const monthFilter = document.getElementById("tailorMonthFilter");
    if(monthFilter){
      monthFilter.addEventListener("change", ()=>{
        tailorFilterState.month = monthFilter.value;
        render();
      });
    }

    // Status filter
    const statusFilter = document.getElementById("tailorStatusFilter");
    if(statusFilter){
      statusFilter.addEventListener("change", ()=>{
        tailorFilterState.status = statusFilter.value;
        render();
      });
    }

    // Search filter
    const searchInput = document.getElementById("tailorSearchInput");
    if(searchInput){
      searchInput.addEventListener("input", ()=>{
        tailorFilterState.search = searchInput.value;
        render();
      });
    }

    // Header buttons
    const btnAddTailor = document.getElementById("btnOpenAddTailor");
    if(btnAddTailor) btnAddTailor.addEventListener("click", ()=> openTailorModal());

    const btnAssign = document.getElementById("btnOpenAssignBags");
    if(btnAssign) btnAssign.addEventListener("click", ()=> openAssignModal());

    const btnLogComp = document.getElementById("btnOpenLogCompletion");
    if(btnLogComp) btnLogComp.addEventListener("click", ()=> openLogCompletionModal());

    const btnPay = document.getElementById("btnOpenPayment");
    if(btnPay) btnPay.addEventListener("click", ()=> openPaymentModal());

    const btnColors = document.getElementById("btnOpenColors");
    if(btnColors) btnColors.addEventListener("click", ()=> openColorsModal());

    // Row buttons
    document.querySelectorAll("[data-quick-complete]").forEach(b => {
      b.addEventListener("click", ()=> openLogCompletionModal(b.dataset.quickComplete));
    });

    document.querySelectorAll("[data-quick-assign]").forEach(b => {
      b.addEventListener("click", ()=> openAssignModal(b.dataset.quickAssign));
    });

    document.querySelectorAll("[data-view-tailor]").forEach(b => {
      b.addEventListener("click", ()=> openTailorHistoryModal(b.dataset.viewTailor));
    });

    document.querySelectorAll("[data-edit-tailor]").forEach(b => {
      b.addEventListener("click", ()=>{
        const t = (state.tailors||[]).find(x => x.id === b.dataset.editTailor);
        if(t) openTailorModal(t);
      });
    });

    document.querySelectorAll("[data-toggle-tailor-status]").forEach(b => {
      b.addEventListener("click", ()=>{
        const t = (state.tailors||[]).find(x => x.id === b.dataset.toggleTailorStatus);
        if(t){
          t.status = (t.status === "Active" || !t.status) ? "Inactive" : "Active";
          t.updatedAt = new Date().toISOString();
          saveState();
          toast(`Tailor ${t.name} is now ${t.status}`);
          render();
        }
      });
    });

    document.querySelectorAll("[data-del-tailor]").forEach(b => {
      b.addEventListener("click", ()=>{
        const id = b.dataset.delTailor;
        confirmDelete("This tailor and all associated assignments and payments will be permanently removed.", ()=>{
          state.tailors = (state.tailors||[]).filter(t => t.id !== id);
          state.assignments = (state.assignments||[]).filter(a => a.tailorId !== id);
          state.payments = (state.payments||[]).filter(p => p.tailorId !== id);
          state.completions = (state.completions||[]).filter(c => c.tailorId !== id);
          saveState();
          toast("Tailor deleted");
          render();
        });
      });
    });

    document.querySelectorAll("[data-del-completion]").forEach(b => {
      b.addEventListener("click", ()=>{
        deleteCompletion(b.dataset.delCompletion);
      });
    });

    document.querySelectorAll("[data-del-assign]").forEach(b => {
      b.addEventListener("click", ()=>{
        const id = b.dataset.delAssign;
        confirmDelete("This assignment record will be removed.", ()=>{
          state.assignments = (state.assignments||[]).filter(a => a.id !== id);
          saveState();
          toast("Assignment deleted");
          render();
        });
      });
    });
  }

  if(currentTab === "data"){
    document.getElementById("exportBtn").addEventListener("click", ()=>{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `doublebee-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast("Backup downloaded");
    });
    const fileInput = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          showModal(`
            <h3>Restore this backup?</h3>
            <p>All current data in this browser will be replaced with the contents of "${esc(file.name)}".</p>
            <div class="form-actions">
              <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" id="confirmRestore">Restore</button>
            </div>
          `);
          document.getElementById("confirmRestore").addEventListener("click", ()=>{
            state = Object.assign(defaultState(), parsed);
            saveState(); closeModal(); toast("Data restored"); render();
          });
        }catch(err){ toast("That file doesn't look like a valid backup."); }
      };
      reader.readAsText(file);
    });
    document.getElementById("wipeBtn").addEventListener("click", ()=>{
      showModal(`
        <h3>Erase everything?</h3>
        <p>All categories, orders, returns, income, expenses, tailors and payments will be permanently deleted from this browser.</p>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" id="confirmWipe">Erase all data</button>
        </div>
      `);
      document.getElementById("confirmWipe").addEventListener("click", ()=>{
        state = defaultState(); saveState(); closeModal(); toast("All data erased"); render();
      });
    });
  }
}

/* ---------------- Init ---------------- */
renderNav();
render();
</script>
</body>
</html>
