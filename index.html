<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>doubleBee — Bag Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F4F7;
    --bg-raised: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #EAF1FB;
    --border: #DCE3EC;
    --border-soft: #E7ECF2;
    --text: #1E2733;
    --text-dim: #57626F;
    --text-faint: #8B96A3;
    --accent: #2E6FE0;
    --accent-dim: #6C9CF0;
    --stitch: #C9D8EC;
    --good: #2F8F5B;
    --good-bg: #E3F4EA;
    --bad: #D14343;
    --bad-bg: #FBE7E7;
    --radius: 10px;
    --radius-sm: 6px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{ box-sizing: border-box; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body{ margin:0; padding:0; background: var(--bg); color: var(--text); overflow-x:hidden; width:100%; }
  body{ min-height:100vh; min-height:100dvh; -webkit-tap-highlight-color: transparent; }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  button{ font-family:inherit; }
  input, select, textarea{ font-family:'Inter', sans-serif; }
  ::selection{ background: var(--accent-dim); color: var(--text); }

  a{ color: var(--accent); }

  /* ---------- Shell layout ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width: 226px; flex-shrink:0; background: var(--bg-raised);
    border-right: 1px solid var(--border-soft);
    padding: 22px 14px; display:flex; flex-direction:column; gap:4px;
    position: sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding: 4px 10px 22px 10px; }
  .brand-mark{ width:30px; height:30px; flex-shrink:0; }
  .brand-text h1{ font-size:19px; color:var(--text); line-height:1.1; }
  .brand-text span{ font-size:11px; color: var(--text-faint); letter-spacing:0.02em; }

  .nav-btn{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius: var(--radius-sm); border:none; background:transparent;
    color: var(--text-dim); font-size:14px; cursor:pointer; transition: background .12s ease, color .12s ease;
  }
  .nav-btn svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
  .nav-btn:hover{ background: var(--surface); color: var(--text); }
  .nav-btn.active{ background: var(--surface-2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }

  .sidebar-foot{ margin-top:auto; padding: 10px; font-size:11px; color: var(--text-faint); line-height:1.5; }

  .main{ flex:1; min-width:0; padding: 26px 30px 90px 30px; }
  .topline{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
  .topline h2{ font-size:26px; }
  .topline p{ margin:4px 0 0 0; color: var(--text-faint); font-size:13px; }

  .mobile-topbar{ display:none; }

  /* ---------- Cards / grid ---------- */
  .grid{ display:grid; gap:14px; }
  .kpi-grid{ grid-template-columns: repeat(4, 1fr); margin-bottom: 22px; }
  .card{
    background: var(--surface); border:1px solid var(--border-soft); border-radius: var(--radius);
    padding: 18px;
  }
  .kpi-card{ position:relative; overflow:hidden; }
  .kpi-label{ font-size:12px; color: var(--text-faint); margin-bottom:8px; }
  .kpi-value{ font-family:'Fraunces', serif; font-size:26px; font-weight:600; color: var(--text); }
  .kpi-value.good{ color: var(--good); }
  .kpi-value.bad{ color: var(--bad); }
  .kpi-sub{ font-size:11.5px; color: var(--text-faint); margin-top:6px; }

  .section-title{ font-size:15px; color: var(--text-dim); margin: 26px 0 12px 0; display:flex; align-items:center; gap:8px; }
  .section-title::after{ content:""; flex:1; height:1px; background: var(--border-soft); }

  /* ---------- Forms ---------- */
  .form-card{ margin-bottom: 20px; }
  .form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; color: var(--text-faint); }
  .field input, .field select, .field textarea{
    background: var(--bg-raised); border:1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: var(--radius-sm); font-size:14px; outline:none;
    transition: border-color .12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent-dim); }
  .field .readout{ font-size:14px; color: var(--accent); padding-top:9px; font-family:'Fraunces',serif; font-weight:600; }
  .form-actions{ display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }

  .btn{
    padding: 6px 12px; border-radius: var(--radius-sm); border:1px solid transparent; font-size:12px;
    cursor:pointer; font-weight:600; transition: filter .12s ease, transform .05s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn svg{ width: 14px; height: 14px; }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); color: #FFFFFF; }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-ghost:hover{ background: var(--surface-2); color: var(--text); }
  .btn-danger{ background: transparent; color: var(--bad); border-color: var(--bad-bg); }
  .btn-danger:hover{ background: var(--bad-bg); }
  .btn-sm{ padding: 4px 8px; font-size:11px; }
  .btn-sm svg{ width: 12px; height: 12px; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius: var(--radius); }
  table{ width:100%; border-collapse: collapse; font-size:13.5px; min-width: 560px; }
  thead th{
    text-align:left; padding: 10px 12px; color: var(--text-faint); font-weight:600; font-size:11.5px;
    background: var(--bg-raised); border-bottom:1px solid var(--border-soft); white-space:nowrap;
  }
  tbody td{ padding: 10px 12px; border-bottom:1px solid var(--border-soft); color: var(--text-dim); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: var(--surface-2); }
  td.num, th.num{ text-align:right; font-variant-numeric: tabular-nums; }
  td.strong{ color: var(--text); font-weight:600; }
  .pill{ display:inline-block; padding:2px 9px; border-radius: 100px; font-size:11px; font-weight:600; }
  .pill.good{ background: var(--good-bg); color: var(--good); }
  .pill.bad{ background: var(--bad-bg); color: var(--bad); }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color: var(--text-faint); padding:4px; border-radius:5px; }
  .icon-btn:hover{ color: var(--text); background: var(--bg-raised); }
  .empty-row td{ text-align:center; color: var(--text-faint); padding: 26px 12px; }

  /* ---------- Misc ---------- */
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  .filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input{
    background: var(--bg-raised); border:1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: var(--radius-sm); font-size:13px;
  }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip{
    background: var(--bg-raised); border:1px solid var(--border); color: var(--text-dim);
    padding:5px 11px; border-radius:100px; font-size:12px; display:flex; align-items:center; gap:7px;
  }
  .chip button{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:13px; line-height:1; padding:0; }

  .divider-stitch{
    height:1px; margin: 24px 0;
    background-image: repeating-linear-gradient(to right, var(--stitch) 0 6px, transparent 6px 12px);
  }

  .tailor-card{ display:flex; flex-direction:column; gap:10px; }
  .tailor-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .tailor-name{ font-family:'Fraunces',serif; font-size:17px; }
  .tailor-stats{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-top:6px; }
  .tstat{ background: var(--bg-raised); border-radius: var(--radius-sm); padding:9px 10px; }
  .tstat .n{ font-family:'Fraunces',serif; font-size:16px; color: var(--text); }
  .tstat .l{ font-size:10.5px; color: var(--text-faint); margin-top:2px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border:1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: var(--radius); font-size:13.5px; opacity:0; pointer-events:none;
    transition: all .22s ease; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .modal-backdrop{
    position:fixed; inset:0; background: rgba(30,39,51,.45); display:none; align-items:center; justify-content:center;
    z-index: 900; padding: 20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:22px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
  .modal.modal-lg{ max-width: 820px; }
  .modal.modal-md{ max-width: 560px; }
  .modal h3{ font-size:17px; margin-bottom:8px; }
  .modal p{ color: var(--text-dim); font-size:13.5px; line-height:1.5; margin: 0 0 18px 0; }
  .modal .form-actions{ margin-top:0; }
  .tailor-badge-id{ font-family: monospace; font-size: 11px; padding: 2px 7px; background: var(--surface-2); border-radius: 4px; color: var(--accent); font-weight: 600; }
  .status-pill{ display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status-pill.active{ background: var(--good-bg); color: var(--good); }
  .status-pill.inactive{ background: var(--bad-bg); color: var(--bad); }
  .progress-pill{ font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display:inline-block; }
  .progress-pill.pending{ background: #FEF3C7; color: #92400E; }
  .progress-pill.done{ background: var(--good-bg); color: var(--good); }
  .batch-assign-table{ width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .batch-assign-table th{ background: var(--bg); font-size: 11.5px; padding: 7px 9px; text-align: left; color: var(--text-faint); font-weight: 600; border-bottom: 1px solid var(--border-soft); }
  .batch-assign-table td{ padding: 7px 9px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .batch-assign-table input, .batch-assign-table select{ padding: 7px 9px; font-size: 13px; width: 100%; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-raised); color:var(--text); box-sizing:border-box; }
  .batch-assign-table input:focus, .batch-assign-table select:focus{ border-color:var(--accent-dim); outline:none; }
  .action-row-btns{ display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .bottom-nav{ display:none; }

  @media (max-width: 900px){
    .kpi-grid{ grid-template-columns: repeat(2,1fr); }
    .two-col{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
    .main{
      padding: 16px 14px calc(96px + env(safe-area-inset-bottom)) 14px;
      padding-left: calc(14px + env(safe-area-inset-left));
      padding-right: calc(14px + env(safe-area-inset-right));
    }
    .mobile-topbar{
      display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:50;
      background: var(--bg-raised); border-bottom:1px solid var(--border-soft);
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px 16px;
      margin: -16px -14px 20px -14px;
    }
    .mobile-topbar h1{ font-size:17px; }
    .topline{ margin-bottom:16px; }
    .topline h2{ font-size:22px; }
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; background: var(--bg-raised);
      border-top:1px solid var(--border-soft); z-index: 60;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      padding-left: calc(4px + env(safe-area-inset-left));
      padding-right: calc(4px + env(safe-area-inset-right));
      overflow-x:auto; -webkit-overflow-scrolling: touch;
    }
    .bottom-nav button{
      flex: 1 1 0; min-width: 56px; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
      color: var(--text-faint); font-size:9.5px; padding:6px 4px; cursor:pointer; min-height:44px;
    }
    .bottom-nav button.active{ color: var(--accent); }
    .bottom-nav svg{ width:19px; height:19px; }

    /* Comfortable tap targets on touch devices */
    .btn{ min-height:38px; }
    .btn-sm{ min-height:32px; }
    .icon-btn{ padding:7px; min-width:32px; min-height:32px; }
    .nav-btn{ min-height:40px; }

    /* Prevent iOS Safari auto-zoom on focus (needs >=16px font) */
    input, select, textarea{ font-size:16px !important; }
  }
  @media (max-width: 560px){
    .kpi-grid{ grid-template-columns: repeat(2,1fr); gap:10px; }
    .kpi-card{ padding:14px; }
    .kpi-value{ font-size:21px; word-break:break-word; }
    .kpi-label{ font-size:11px; }
    .kpi-sub{ font-size:10.5px; }
    table{ min-width: 480px; }
    .tailor-stats{ grid-template-columns: repeat(2,1fr); }
    .card{ padding:14px; }
    .section-title{ font-size:14px; margin: 20px 0 10px 0; }

    /* Any inline two-column form grids collapse to one column */
    .form-grid[style*="1fr 1fr"],
    .form-grid[style*="repeat(auto-fit"]{ grid-template-columns: 1fr !important; }

    .form-actions{ flex-direction:column-reverse; align-items:stretch; gap:8px; }
    .form-actions .btn{ width:100%; }

    .action-row-btns{ flex-direction:column; align-items:stretch; }
    .action-row-btns > *{ width:100%; }

    .filter-bar{ flex-direction:column; align-items:stretch; }
    .filter-bar select, .filter-bar input{ width:100%; }

    .modal-backdrop{ padding:12px; }
    .modal{ padding:16px; border-radius:12px; max-height:92vh; }
    .modal h3{ font-size:16px; }

    .tailor-head{ flex-direction:column; gap:8px; }

    [style*="grid-template-columns:repeat(3,1fr)"],
    [style*="grid-template-columns: repeat(3,1fr)"]{ grid-template-columns: repeat(2,1fr) !important; }
  }
  @media (max-width: 400px){
    .kpi-grid{ grid-template-columns: 1fr; }
    .tailor-stats{ grid-template-columns: repeat(2,1fr); }
    .bottom-nav button span{ display:none; }
    .bottom-nav button{ min-width:44px; }
    .bottom-nav svg{ width:21px; height:21px; }
  }

  .analytics-filter-card{ margin-bottom:20px; }
  .analytics-filter-title{ font-family:'Fraunces',serif; font-size:18px; margin-bottom:12px; }
  .analytics-filter-note{ font-size:11.5px; color:var(--text-faint); margin-top:10px; }
  .chart-card{ padding:14px 16px 10px; overflow:hidden; }
  .svg-chart-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 2px 8px; }
  .svg-chart-head strong{ font-family:'Fraunces',serif; font-size:16px; }
  .svg-chart-head span{ font-size:11px; color:var(--text-faint); text-align:right; }
  .analytics-svg{ display:block; width:100%; height:auto; min-height:220px; }
  .analytics-charts{ align-items:start; }
  @media (max-width:900px){ .analytics-svg{ min-height:200px; } }
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="mobile-topbar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 8V6a5 5 0 0110 0v2" stroke="#2E6FE0" stroke-width="1.6"/><rect x="4" y="8" width="16" height="12" rx="2" stroke="#2E6FE0" stroke-width="1.6"/></svg>
      <h1 style="color:var(--text)">doubleBee</h1>
    </div>
    <div class="topline">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <p id="pageSub">Your business, at a glance.</p>
      </div>
      <div id="topActions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================
   DOUBLEBEE — Bag Business Manager
   Single-file vanilla JS app. Data persisted to localStorage.
   ========================================================= */

const STORAGE_KEY = "doublebee_bagbiz_v1";
const CURRENCY = "LKR";

const NAV_ITEMS = [
  { id:"dashboard", label:"Dashboard", icon: iconHome },
  { id:"categories", label:"Bag Catalog", icon: iconTag },
  { id:"orders", label:"Orders", icon: iconBox },
  { id:"returns", label:"Returns", icon: iconReturn },
  { id:"reports", label:"Reports", icon: iconChart },
  { id:"finance", label:"Income & Expenses", icon: iconCoin },
  { id:"tailors", label:"Tailors", icon: iconNeedle },
  { id:"data", label:"Backup & Restore", icon: iconDisk },
];

let state = loadState();
let currentTab = "dashboard";

function defaultState(){
  return {
    categories: [],
    orders: [],
    returns: [],
    income: [],
    expenses: [],
    incomeTypes: ["Sales", "Custom Order", "Other"],
    expenseTypes: ["Raw Materials", "Marketing", "Utilities", "Rent", "Wages", "Other"],
    tailors: [],
    assignments: [],
    payments: [],
    completions: [],
    colors: ["Black", "Red", "Brown", "Blue", "Green", "White", "Navy", "Tan", "Maroon", "Beige", "Yellow", "Olive"],
    settings: { defaultDelivery: 500 },
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){
  n = Number(n)||0;
  return CURRENCY + " " + n.toLocaleString("en-LK", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtNum(n){ return Number(n)||0; }
function monthKey(dateStr){ return (dateStr||"").slice(0,7); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getCategoryColors(cat){
  if(!cat) return [];
  if(Array.isArray(cat.colors)) return cat.colors.map(c=>String(c).trim()).filter(Boolean);
  if(typeof cat.colors === "string") return cat.colors.split(",").map(c=>c.trim()).filter(Boolean);
  return [];
}

let tailorFilterState = { month: "all", status: "all", search: "" };

function getAllColors(){
  const base = Array.isArray(state.colors) && state.colors.length ? state.colors : ["Black", "Red", "Brown", "Blue", "Green", "White", "Navy", "Tan", "Maroon", "Beige", "Yellow", "Olive"];
  const fromCategories = (state.categories||[]).flatMap(c => getCategoryColors(c));
  return Array.from(new Set([...base, ...fromCategories])).map(c => String(c).trim()).filter(Boolean);
}

function addGlobalColor(newCol){
  newCol = (newCol||"").trim();
  if(!newCol) return;
  if(!Array.isArray(state.colors)) state.colors = [];
  if(!state.colors.some(c => c.toLowerCase() === newCol.toLowerCase())){
    state.colors.push(newCol);
    saveState();
  }
}

function getTailorCode(t, index){
  if(t.code) return t.code;
  if(typeof index === "number") return "T-" + String(index + 1).padStart(3, "0");
  const idx = (state.tailors||[]).findIndex(x => x.id === t.id);
  return idx >= 0 ? "T-" + String(idx + 1).padStart(3, "0") : "T-001";
}

function getTailorStats(tailorId, monthFilter = "all"){
  const allAssigns = (state.assignments||[]).filter(a => a.tailorId === tailorId);
  const filteredAssigns = monthFilter && monthFilter !== "all" 
    ? allAssigns.filter(a => (a.month || (a.date||"").slice(0,7)) === monthFilter)
    : allAssigns;
  
  const totalAssigned = filteredAssigns.reduce((s, a) => s + (Number(a.assignedQty)||0), 0);
  const totalCompleted = filteredAssigns.reduce((s, a) => s + (Number(a.completedQty)||0), 0);
  const inProgress = Math.max(0, totalAssigned - totalCompleted);
  const totalEarned = filteredAssigns.reduce((s, a) => s + (Number(a.completedQty)||0) * (Number(a.rate)||0), 0);

  const allPayments = (state.payments||[]).filter(p => p.tailorId === tailorId);
  const filteredPayments = monthFilter && monthFilter !== "all"
    ? allPayments.filter(p => (p.month || (p.date||"").slice(0,7)) === monthFilter)
    : allPayments;
  const totalPaid = filteredPayments.reduce((s, p) => s + (Number(p.amount)||0), 0);

  // Cumulative all-time stats for lifetime balance and in-progress carryover
  const cumEarned = allAssigns.reduce((s, a) => s + (Number(a.completedQty)||0) * (Number(a.rate)||0), 0);
  const cumPaid = allPayments.reduce((s, p) => s + (Number(p.amount)||0), 0);
  const balance = cumEarned - cumPaid;

  const cumAssigned = allAssigns.reduce((s, a) => s + (Number(a.assignedQty)||0), 0);
  const cumCompleted = allAssigns.reduce((s, a) => s + (Number(a.completedQty)||0), 0);
  const cumInProgress = Math.max(0, cumAssigned - cumCompleted);

  const allCompletions = (state.completions||[]).filter(c => c.tailorId === tailorId);
  const filteredCompletions = monthFilter && monthFilter !== "all"
    ? allCompletions.filter(c => (c.month || (c.date||"").slice(0,7)) === monthFilter)
    : allCompletions;

  return {
    totalAssigned, totalCompleted, inProgress, totalEarned, totalPaid, balance,
    cumEarned, cumPaid, cumInProgress, cumAssigned, cumCompleted,
    assigns: filteredAssigns, allAssigns, payments: filteredPayments, allPayments,
    completions: filteredCompletions, allCompletions
  };
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove("show"), 2200);
}

function showModal(html, sizeClass = ""){
  const box = document.getElementById("modalBox");
  box.className = "modal " + (sizeClass || "");
  box.innerHTML = html;
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){ document.getElementById("modalBackdrop").classList.remove("show"); }
document.getElementById("modalBackdrop").addEventListener("click", (e)=>{
  if(e.target.id === "modalBackdrop") closeModal();
});
function confirmDelete(msg, onYes){

      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>

}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const currentDate = todayStr();
  const allDates = [...state.orders.map(o=>o.date), ...state.returns.map(r=>r.date), ...state.expenses.map(e=>e.date)].filter(Boolean);
  const detectedYears = Array.from(new Set(allDates.map(d=>d.slice(0,4)))).filter(Boolean).sort().reverse();
  const currentYear = currentDate.slice(0,4);
  const currentMonthNum = currentDate.slice(5,7);
  const availableYears = detectedYears.length ? detectedYears : [currentYear];
  if(!availableYears.includes(currentYear)) availableYears.unshift(currentYear);

  const selectedYear = dashboardState.year || (dashboardState.date ? dashboardState.date.slice(0,4) : currentYear);
  const selectedMonthNum = dashboardState.month || (dashboardState.date ? dashboardState.date.slice(5,7) : currentMonthNum);
  const selectedMonth = selectedYear + "-" + selectedMonthNum;
  const selectedCategory = dashboardState.categoryId || "all";
  const selectedStatus = dashboardState.status || "all";

  const monthOptions = [
    {val: "01", name: "January"},
    {val: "02", name: "February"},
    {val: "03", name: "March"},
    {val: "04", name: "April"},
    {val: "05", name: "May"},
    {val: "06", name: "June"},
    {val: "07", name: "July"},
    {val: "08", name: "August"},
    {val: "09", name: "September"},
    {val: "10", name: "October"},
    {val: "11", name: "November"},
    {val: "12", name: "December"}
  ];

  const matches = (o)=> (selectedCategory==="all" || o.categoryId===selectedCategory)
    && (selectedStatus==="all" || (o.status||"Completed")===selectedStatus);
  const yearOrders = state.orders.filter(o=> (o.date||"").startsWith(selectedYear+"-") && matches(o));
  const monthOrders = state.orders.filter(o=> monthKey(o.date)===selectedMonth && matches(o));
  const monthReturns = state.returns.filter(r=> monthKey(r.date)===selectedMonth && (selectedCategory==="all" || r.categoryId===selectedCategory));
  const monthExpenses = state.expenses.filter(e=> monthKey(e.date)===selectedMonth);

  // Financial profit uses completed orders only. Other income is intentionally excluded.
  const completedOrders = state.orders.filter(o=> monthKey(o.date)===selectedMonth
    && (selectedCategory==="all" || o.categoryId===selectedCategory)
    && (o.status||"Completed")==="Completed");
  const grossProfit = completedOrders.reduce((s,o)=> s + orderTotals(o).totalProfit, 0);
  const returnLoss = monthReturns.reduce((s,r)=> s + returnTotalLoss(r), 0);
  const totalExpenses = monthExpenses.reduce((s,e)=> s + Number(e.amount||0), 0);
  const profitAfterReturns = grossProfit - returnLoss;
  const netProfit = profitAfterReturns - totalExpenses;
  const totalSalesIncome = completedOrders.reduce((s,o)=> s + orderTotals(o).totalSelling, 0);
  const returnQtyTotal = monthReturns.reduce((s,r)=> s + (Number(r.qty)||0), 0);

  const categories = state.categories;
  const statuses = ["all","Completed","Pending","Cancelled"];

  const monthlyData = Array.from({length:12},(_,i)=>{
    const key = selectedYear + "-" + String(i+1).padStart(2,"0");
    return { label: new Date(Number(selectedYear),i,1).toLocaleDateString("en-US",{month:"short"}),
      value: state.orders.filter(o=>monthKey(o.date)===key && matches(o)).length };
  });

  const daysInMonth = new Date(Number(selectedYear), Number(selectedMonthNum), 0).getDate();
  const dailyData = Array.from({length:daysInMonth},(_,i)=>{
    const day=String(i+1).padStart(2,"0"), key=selectedMonth+"-"+day;
    return {label:String(i+1), value:monthOrders.filter(o=>o.date===key).length};
  });

  const weeklyData = Array.from({length:5},(_,i)=>{
    const from=i*7+1, to=Math.min((i+1)*7,daysInMonth);
    return {label:`W${i+1}`, value:monthOrders.filter(o=>{ const d=Number((o.date||"").slice(8,10)); return d>=from&&d<=to; }).length, range:`${from}–${to}`};
  }).filter(w=>Number(w.range.split("–")[0])<=daysInMonth);

  const categoryMonthData = categories.map(c=>({
    label:c.name,
    value:monthOrders.filter(o=>o.categoryId===c.id).length
  })).sort((a,b)=>b.value-a.value);

  const monthlyChart = renderSvgLineChart(monthlyData,"Monthly total orders",`${selectedCategory==="all"?"All categories":(categories.find(c=>c.id===selectedCategory)?.name||"Selected category")} · order count`);
  const dailyChart = renderSvgBarChart(dailyData,"Daily total orders",`${monthLabel(selectedMonth)} · ${selectedCategory==="all"?"All categories":(categories.find(c=>c.id===selectedCategory)?.name||"")} · order count`);
  const weeklyChart = renderSvgBarChart(weeklyData.map(x=>({...x,label:x.label+" ("+x.range+")"})),"Weekly total orders",`${monthLabel(selectedMonth)} · ${selectedCategory==="all"?"All categories":(categories.find(c=>c.id===selectedCategory)?.name||"")}`);
  const categoryChart = renderSvgBarChart(categoryMonthData,"Category-wise orders",monthLabel(selectedMonth));

  return `
    <div class="card analytics-filter-card">
      <div class="analytics-filter-title">Order analytics</div>
      <div class="form-grid">
        <div class="field">
          <label>Analysis month (12 Months)</label>
          <select id="dashMonth">
            ${monthOptions.map(m=>`<option value="${m.val}" ${selectedMonthNum===m.val?'selected':''}>${m.name}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Analysis year</label>
          <select id="dashYear">
            ${availableYears.map(y=>`<option value="${y}" ${selectedYear===y?'selected':''}>${y}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Bag category</label><select id="dashCategory"><option value="all">All Categories</option>${categories.map(c=>`<option value="${c.id}" ${selectedCategory===c.id?'selected':''}>${esc(c.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Order status</label><select id="dashStatus">${statuses.map(st=>`<option value="${st}" ${selectedStatus===st?'selected':''}>${st==="all"?"All Statuses":st}</option>`).join("")}</select></div>
      </div>
      <div class="analytics-filter-note">Select any of the 12 months and year to view daily, weekly, and category order analytics and financial breakdown.</div>
    </div>

    <div class="grid kpi-grid">
      <div class="card kpi-card"><div class="kpi-label">Total Sales Income</div><div class="kpi-value">${fmt(totalSalesIncome)}</div><div class="kpi-sub">Completed orders · ${completedOrders.reduce((s,o)=>s+(Number(o.qty)||0),0)} bags</div></div>
      <div class="card kpi-card"><div class="kpi-label">Total Operating Expenses</div><div class="kpi-value">${fmt(totalExpenses)}</div><div class="kpi-sub">${monthExpenses.length} expense entr${monthExpenses.length===1?'y':'ies'}</div></div>
      <div class="card kpi-card"><div class="kpi-label">Total Return Loss</div><div class="kpi-value bad">${fmt(returnLoss)}</div><div class="kpi-sub">${monthReturns.length} return${monthReturns.length===1?'':'s'} · ${returnQtyTotal} bags</div></div>
      <div class="card kpi-card"><div class="kpi-label">Net Monthly Profit</div><div class="kpi-value ${netProfit>=0?'good':'bad'}">${fmt(netProfit)}</div><div class="kpi-sub">Profit after returns − total expenses · other income excluded</div></div>
    </div>

    <div class="section-title">12-month order comparison · ${selectedYear}</div>
    <div class="card chart-card">${monthlyChart}</div>

    <div class="two-col analytics-charts">
      <div><div class="section-title">Daily order comparison · ${monthLabel(selectedMonth)}</div><div class="card chart-card">${dailyChart}</div></div>
      <div><div class="section-title">Weekly order comparison · ${monthLabel(selectedMonth)}</div><div class="card chart-card">${weeklyChart}</div></div>
    </div>

    <div class="section-title">Category-wise order comparison · ${monthLabel(selectedMonth)}</div>
    <div class="card chart-card">${categoryChart}</div>

    <div class="section-title">Category-wise financial breakdown · ${monthLabel(selectedMonth)}</div>
    <div class="table-wrap"><table><thead><tr><th>Bag Category</th><th class="num">Bags Sold</th><th class="num">Total Sales</th><th class="num">Returned</th><th class="num">Profit After Return</th></tr></thead><tbody>
      ${categoryMonthData.length ? categoryMonthData.map(d=>{
        const cat=categories.find(c=>c.name===d.label); const orders=monthOrders.filter(o=>o.categoryId===cat?.id); const returns=monthReturns.filter(r=>r.categoryId===cat?.id);
        const sales=orders.reduce((s,o)=>s+orderTotals(o).totalSelling,0); const profit=orders.reduce((s,o)=>s+orderTotals(o).totalProfit,0)-returns.reduce((s,r)=>s+returnTotalLoss(r),0);
        const rq=returns.reduce((s,r)=>s+(Number(r.qty)||0),0);
        return `<tr><td class="strong">${esc(d.label)}</td><td class="num">${d.value}</td><td class="num">${fmt(sales)}</td><td class="num">${rq}</td><td class="num" style="color:${profit>=0?'var(--good)':'var(--bad)'}">${fmt(profit)}</td></tr>`;
      }).join("") : `<tr class="empty-row"><td colspan="5">No orders logged for this month.</td></tr>`}
    </tbody></table></div>
  `;
}

function chartAxisMax(data){
  const max=Math.max(0,...data.map(d=>Number(d.value)||0));
  return max>0 ? Math.ceil(max*1.15) : 1;
}
function renderSvgLineChart(data,title,subtitle){
  const W=900,H=300,L=48,R=18,T=36,B=44, pw=W-L-R, ph=H-T-B, max=chartAxisMax(data);
  const pts=data.map((d,i)=>{const x=L+(data.length===1?pw/2:i*pw/(data.length-1)); const y=T+ph-(Number(d.value)||0)/max*ph; return {...d,x,y};});
  const grid=[0,0.25,0.5,0.75,1].map(v=>{const y=T+ph-v*ph; return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--border-soft)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-faint)">${Math.round(max*v)}</text>`;}).join("");
  const path=pts.map((p,i)=>(i?"L":"M")+`${p.x},${p.y}`).join(" ");
  const labels=pts.map(p=>`<text x="${p.x}" y="${H-16}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${esc(p.label)}</text><circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/><title>${esc(p.label)}: ${p.value} orders</title>`).join("");
  return `<div class="svg-chart-head"><strong>${esc(title)}</strong><span>${esc(subtitle)}</span></div><svg class="analytics-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${labels}</svg>`;
}
function renderSvgBarChart(data,title,subtitle){
  const W=900,H=300,L=48,R=18,T=36,B=54,pw=W-L-R,ph=H-T-B,max=chartAxisMax(data),gap=Math.min(10,pw/data.length*.18),bw=Math.max(4,pw/data.length-gap);
  const grid=[0,0.25,0.5,0.75,1].map(v=>{const y=T+ph-v*ph; return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--border-soft)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-faint)">${Math.round(max*v)}</text>`;}).join("");
  const bars=data.map((d,i)=>{const val=Number(d.value)||0,h=val/max*ph,x=L+i*(pw/data.length)+(gap/2),y=T+ph-h; const showLabel=data.length<=12||i%2===0; return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="3" fill="var(--accent)" opacity=".88"><title>${esc(d.label)}: ${val} orders</title></rect>${showLabel?`<text x="${x+bw/2}" y="${H-17}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${esc(d.label)}</text>`:""}`;}).join("");
  return `<div class="svg-chart-head"><strong>${esc(title)}</strong><span>${esc(subtitle)}</span></div><svg class="analytics-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${bars}</svg>`;
}

function renderSvgProfitBarChart(data,title,subtitle){
  const W=900,H=320,L=76,R=20,T=36,B=54,pw=W-L-R,ph=H-T-B;
  const vals=data.map(d=>Number(d.value)||0);
  let maxVal=Math.max(0,...vals);
  let minVal=Math.min(0,...vals);
  if(maxVal===0 && minVal===0){ maxVal=1000; minVal=0; }
  else {
    if(maxVal>0) maxVal=Math.ceil(maxVal*1.15);
    if(minVal<0) minVal=Math.floor(minVal*1.15);
  }
  const span=maxVal-minVal || 1;
  const yZero=T+(maxVal/span)*ph;
  const gap=Math.min(12,pw/data.length*.2), bw=Math.max(10,pw/data.length-gap);

  const steps=4;
  const grid=Array.from({length:steps+1},(_,i)=>{
    const v=maxVal-(span/steps)*i;
    const y=T+(i/steps)*ph;
    const isZero=Math.abs(v)<(span/100) || (minVal<0 && maxVal>0 && Math.abs(y-yZero)<2);
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${isZero?'var(--text-dim)':'var(--border-soft)'}" stroke-width="${isZero?'1.5':'1'}" stroke-dasharray="${isZero?'':'3 3'}"/><text x="${L-10}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-faint)">${Math.round(v).toLocaleString()}</text>`;
  }).join("");

  const bars=data.map((d,i)=>{
    const val=Number(d.value)||0;
    const x=L+i*(pw/data.length)+(gap/2);
    let barY, barH, color;
    if(val>=0){
      const yVal=T+((maxVal-val)/span)*ph;
      barY=yVal;
      barH=Math.max(yZero-yVal, val>0?3:0);
      color="var(--good)";
    } else {
      const yVal=T+((maxVal-val)/span)*ph;
      barY=yZero;
      barH=Math.max(yVal-yZero, 3);
      color="var(--bad)";
    }
    const valFormatted=fmt(val);
    return `
      <rect x="${x}" y="${barY}" width="${bw}" height="${barH}" rx="3" fill="${color}" opacity=".9">
        <title>${esc(d.fullLabel)}&#10;Net Profit: ${valFormatted}&#10;Sales: ${fmt(d.sales)}&#10;Gross Profit: ${fmt(d.grossProfit)}&#10;Return Loss: ${fmt(d.returnLoss)}&#10;Expenses: ${fmt(d.expenses)}</title>
      </rect>
      <text x="${x+bw/2}" y="${H-16}" text-anchor="middle" font-size="10" font-weight="500" fill="var(--text-dim)">${esc(d.label)}</text>
    `;
  }).join("");

  return `<div class="svg-chart-head"><strong>${esc(title)}</strong><span>${esc(subtitle)}</span></div><svg class="analytics-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${bars}</svg>`;
}

let dashboardState = { month: null, year: null, categoryId: "all", status: "all" };

function orderTotals(o){
  const cat = state.categories.find(c=>c.id===o.categoryId) || {cost:0, price:0};
  const qty = Number(o.qty)||0;
  const deliveryPerUnit = Number(o.deliveryCharge)||0;
  const discount = Math.max(0, Number(o.discount)||0);
  const totalDelivery = qty * deliveryPerUnit;
  const grossSelling = qty * Number(cat.price||0);
  const totalSelling = grossSelling - discount;
  const totalCost = qty * Number(cat.cost||0);
  const totalProfit = totalSelling - totalCost - totalDelivery;
  return { totalDelivery, grossSelling, discount, totalSelling, totalCost, totalProfit };
}
function returnRate(r){
  return r.deliveryRate!=null ? Number(r.deliveryRate) : Number(state.settings.defaultDelivery)||0;
}
// Delivery cost lost on the returned bags (qty × delivery charge per bag).
function returnDeliveryAmount(r){
  return (Number(r.qty)||0) * returnRate(r);
}
// The profit-after-delivery that those bags had already contributed to gross profit — reversed out.
function returnProfitImpact(r){
  const cat = state.categories.find(c=>c.id===r.categoryId) || {cost:0, price:0};
  const qty = Number(r.qty)||0;
  return qty * (Number(cat.price||0) - Number(cat.cost||0) - returnRate(r));
}
// Total hit to net profit from this return = delivery amount + profit impact = qty × (price − cost).
function returnTotalLoss(r){
  return returnDeliveryAmount(r) + returnProfitImpact(r);
}
function monthLabel(m){
  if(!m) return "";
  const [y,mo] = m.split("-");
  const d = new Date(Number(y), Number(mo)-1, 1);
  return d.toLocaleDateString("en-US", {month:"long", year:"numeric"});
}

let reportState = { start: null, end: null, categoryId: "all", year: null };

function reportRange(preset){
  const today = todayStr();
  if(preset==="today") return { start: today, end: today };
  if(preset==="week"){
    const d = new Date(); const day = (d.getDay()+6)%7; // Monday=0
    const monday = new Date(d); monday.setDate(d.getDate()-day);
    return { start: monday.toISOString().slice(0,10), end: today };
  }
  if(preset==="month") return { start: today.slice(0,7)+"-01", end: today };
  if(preset==="all"){
    const dates = [...state.orders.map(o=>o.date), ...state.returns.map(r=>r.date)].filter(Boolean).sort();
    return { start: dates.length?dates[0]:today, end: today };
  }
  return null;
}

function renderReports(){
  if(!state.categories.length){
    return `<div class="card">Add a bag category and log some orders first — reports are built from your order history.</div>`;
  }
  const today = todayStr();
  const start = reportState.start || (today.slice(0,7)+"-01");
  const end = reportState.end || today;
  const categoryId = reportState.categoryId || "all";
  const inRange = (d)=> !!d && d>=start && d<=end;

  const allDates = [...state.orders.map(o=>o.date), ...state.returns.map(r=>r.date), ...state.expenses.map(e=>e.date)].filter(Boolean);
  const detectedYears = Array.from(new Set(allDates.map(d=>d.slice(0,4)))).filter(Boolean).sort().reverse();
  const currentYear = today.slice(0,4);
  const availableYears = detectedYears.length ? detectedYears : [currentYear];
  if(!availableYears.includes(currentYear)) availableYears.unshift(currentYear);
  const reportYear = reportState.year || (reportState.start ? reportState.start.slice(0,4) : currentYear);

  const orders = state.orders.filter(o=> inRange(o.date) && (categoryId==="all" || o.categoryId===categoryId));
  const returns = state.returns.filter(r=> inRange(r.date) && (categoryId==="all" || r.categoryId===categoryId));

  const totalBags = orders.reduce((s,o)=> s + (Number(o.qty)||0), 0);
  const totalSelling = orders.reduce((s,o)=> s + orderTotals(o).totalSelling, 0);
  const grossProfit = orders.reduce((s,o)=> s + orderTotals(o).totalProfit, 0);
  const returnQty = returns.reduce((s,r)=> s + (Number(r.qty)||0), 0);
  const returnLoss = returns.reduce((s,r)=> s + returnTotalLoss(r), 0);
  const profitAfterReturn = grossProfit - returnLoss;

  const catMap = {};
  orders.forEach(o=>{
    const cat = state.categories.find(c=>c.id===o.categoryId);
    const name = cat ? cat.name : "Unknown";
    if(!catMap[name]) catMap[name] = {orders:0, qty:0, sales:0, profit:0, returnQty:0, returnLoss:0};
    const t = orderTotals(o);
    catMap[name].orders += 1;
    catMap[name].qty += Number(o.qty)||0;
    catMap[name].sales += t.totalSelling;
    catMap[name].profit += t.totalProfit;
  });
  returns.forEach(r=>{
    const cat = state.categories.find(c=>c.id===r.categoryId);
    const name = cat ? cat.name : "Unknown";
    if(!catMap[name]) catMap[name] = {orders:0, qty:0, sales:0, profit:0, returnQty:0, returnLoss:0};
    catMap[name].returnQty += Number(r.qty)||0;
    catMap[name].returnLoss += returnTotalLoss(r);
  });
  const catRows = Object.entries(catMap).sort((a,b)=> b[1].sales - a[1].sales);

  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const monthFullNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const monthlyProfitData = Array.from({length:12}, (_, i)=>{
    const mKey = reportYear + "-" + String(i+1).padStart(2, "0");
    const mOrders = state.orders.filter(o => monthKey(o.date) === mKey && (categoryId === "all" || o.categoryId === categoryId) && (o.status || "Completed") === "Completed");
    const mReturns = state.returns.filter(r => monthKey(r.date) === mKey && (categoryId === "all" || r.categoryId === categoryId));
    const mExpenses = state.expenses.filter(e => monthKey(e.date) === mKey);

    const mBags = mOrders.reduce((s, o) => s + (Number(o.qty) || 0), 0);
    const mSales = mOrders.reduce((s, o) => s + orderTotals(o).totalSelling, 0);
    const mGrossProfit = mOrders.reduce((s, o) => s + orderTotals(o).totalProfit, 0);
    const mReturnLoss = mReturns.reduce((s, r) => s + returnTotalLoss(r), 0);
    const mReturnQty = mReturns.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    const mTotalExpenses = mExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
    const mProfitAfterReturns = mGrossProfit - mReturnLoss;
    const mNetProfit = mProfitAfterReturns - mTotalExpenses;
    const mMargin = mSales > 0 ? (mNetProfit / mSales) * 100 : 0;

    return {
      label: monthNames[i],
      fullLabel: monthFullNames[i] + " " + reportYear,
      monthKey: mKey,
      value: mNetProfit,
      bags: mBags,
      sales: mSales,
      grossProfit: mGrossProfit,
      returnLoss: mReturnLoss,
      returnQty: mReturnQty,
      expenses: mTotalExpenses,
      netProfit: mNetProfit,
      margin: mMargin,
    };
  });

  const yearTotalBags = monthlyProfitData.reduce((s, m) => s + m.bags, 0);
  const yearTotalSales = monthlyProfitData.reduce((s, m) => s + m.sales, 0);
  const yearTotalGrossProfit = monthlyProfitData.reduce((s, m) => s + m.grossProfit, 0);
  const yearTotalReturnLoss = monthlyProfitData.reduce((s, m) => s + m.returnLoss, 0);
  const yearTotalExpenses = monthlyProfitData.reduce((s, m) => s + m.expenses, 0);

  const profitChart = renderSvgProfitBarChart(

  return `

      <div class="chip-row" style="margin-top:0;">
        <button class="btn btn-ghost btn-sm" data-preset="today">Today</button>
        <button class="btn btn-ghost btn-sm" data-preset="week">This Week</button>
        <button class="btn btn-ghost btn-sm" data-preset="month">This Month</button>
        <button class="btn btn-ghost btn-sm" data-preset="all">All Time</button>
      </div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="field"><label>From</label><input type="date" id="rpStart" value="${start}"></div>
        <div class="field"><label>To</label><input type="date" id="rpEnd" value="${end}"></div>
        <div class="field"><label>Profit report year</label>
          <select id="rpYear">
            ${availableYears.map(y=>`<option value="${y}" ${reportYear===y?"selected":""}>${y}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Bag category</label>
          <select id="rpCategory">
            <option value="all" ${categoryId==="all"?"selected":""}>All Categories</option>
            ${state.categories.map(c=>`<option value="${c.id}" ${categoryId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>

    <div class="grid kpi-grid">
      <div class="card kpi-card">
        <div class="kpi-label">Bags Sold</div>
        <div class="kpi-value">${totalBags}</div>
        <div class="kpi-sub">${orders.length} order${orders.length===1?'':'s'}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Total Selling Price</div>
        <div class="kpi-value">${fmt(totalSelling)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Gross Profit</div>
        <div class="kpi-value">${fmt(grossProfit)}</div>
        <div class="kpi-sub">Before returns</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Returned</div>
        <div class="kpi-value">${returnQty}</div>
        <div class="kpi-sub">${returns.length} return${returns.length===1?'':'s'} · loss ${fmt(returnLoss)}</div>
      </div>
    </div>
    <div class="card kpi-card" style="margin-bottom:22px;">
      <div class="kpi-label">Profit After Returns (${monthOrRangeLabel(start,end)})</div>

      <div class="kpi-sub">Gross profit − return loss, for ${monthOrRangeLabel(start,end)}${categoryId!=="all" ? " · "+esc(state.categories.find(c=>c.id===categoryId)?.name||"") : ""}</div>

        </tbody>
        <tfoot>
          <tr style="background:var(--bg-raised);font-weight:600;border-top:2px solid var(--border);">
            <td class="strong">Full Year Total (${reportYear})</td>
            <td class="num">${yearTotalBags}</td>
            <td class="num">${fmt(yearTotalSales)}</td>
            <td class="num">${fmt(yearTotalGrossProfit)}</td>
            <td class="num" style="${yearTotalReturnLoss>0?'color:var(--bad);':''}">${yearTotalReturnLoss>0 ? fmt(yearTotalReturnLoss) : '—'}</td>
            <td class="num" style="${yearTotalExpenses>0?'color:var(--bad);':''}">${yearTotalExpenses>0 ? fmt(yearTotalExpenses) : '—'}</td>
            <td class="num" style="font-size:14px;color:${yearTotalNetProfit>=0?'var(--good)':'var(--bad)'}">${fmt(yearTotalNetProfit)}</td>
            <td class="num"><span class="pill ${yearAvgMargin>=0?'good':'bad'}">${yearTotalSales>0 ? yearAvgMargin.toFixed(1)+'%' : '—'}</span></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="section-title">Category breakdown · ${monthOrRangeLabel(start,end)}</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Bag Category</th><th class="num">Bags Sold</th><th class="num">Total Sales</th>
          <th class="num">Gross Profit</th><th class="num">Returned</th><th class="num">Profit After Return</th>
        </tr></thead>
        <tbody>
          ${catRows.length ? catRows.map(([name,d])=>{
            const par = d.profit - d.returnLoss;
            return `<tr>
              <td class="strong">${esc(name)}</td>
              <td class="num">${d.qty}</td>
              <td class="num">${fmt(d.sales)}</td>
              <td class="num">${fmt(d.profit)}</td>
              <td class="num">${d.returnQty}</td>
              <td class="num" style="color:${par>=0?'var(--good)':'var(--bad)'}">${fmt(par)}</td>
            </tr>`;
          }).join("") : `<tr class="empty-row"><td colspan="6">No orders in this period.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function monthOrRangeLabel(start,end){
  if(start===end) return new Date(start).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
  return `${new Date(start).toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${new Date(end).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`;
}

            <div class="field"><label>Expense type</label>
              <select name="type" required>${state.expenseTypes.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
            </div>
            <div class="field" style="grid-column: 1/-1"><label>Description</label><input name="desc" placeholder="Optional note"></div>
            <div class="field"><label>Amount (${CURRENCY})</label><input name="amount" type="number" step="0.01" min="0" required></div>
          </form>
          <div style="margin-top:10px">
            <input id="newExpenseType" placeholder="Add custom expense type…" style="background:var(--bg-raised);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12.5px;width:65%">
            <button class="btn btn-ghost btn-sm" id="addExpenseType">Add type</button>
          </div>
          <div class="form-actions"><button class="btn btn-primary" id="expenseSubmit">${iconPlus()} Add expense</button></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody>
              ${expRows.length ? expRows.map(e=>`
                <tr><td>${e.date}</td><td>${esc(e.type)}</td><td>${esc(e.desc||"—")}</td>
                <td class="num" style="color:var(--bad)">${fmt(e.amount)}</td>
                <td><button class="icon-btn" data-del-expense="${e.id}">${iconTrash()}</button></td></tr>
